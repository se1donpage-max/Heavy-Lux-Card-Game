<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1,
                 maximum-scale=1,
                 user-scalable=no,
                 viewport-fit=cover"
    >

    <meta name="theme-color" content="#080808">

    <title>Heavy Lux Card</title>

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;

            background: #080808;
            color: #ffffff;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
        }

        .app {
            width: 100%;
            max-width: 520px;

            margin: 0 auto;

            padding:
                calc(24px + env(safe-area-inset-top))
                18px
                calc(24px + env(safe-area-inset-bottom));
        }

        h1 {
            margin: 0 0 8px;

            font-size: 28px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .subtitle {
            margin-bottom: 24px;

            color: #777;

            font-size: 14px;
        }

        .panel {
            padding: 18px;

            border: 1px solid #252525;
            border-radius: 18px;

            background: #111111;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 12px;

            min-height: 52px;

            border-bottom: 1px solid #222222;
        }

        .step:last-child {
            border-bottom: 0;
        }

        .icon {
            width: 28px;
            height: 28px;
            min-width: 28px;

            border-radius: 50%;

            background: #252525;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 12px;
            font-weight: 800;
        }

        .name {
            font-size: 14px;
            font-weight: 700;
        }

        .result {
            margin-left: auto;

            font-size: 11px;
            font-weight: 800;
        }

        .ok {
            color: #ffffff;
        }

        .bad {
            color: #ff6262;
        }

        .waiting {
            color: #777777;
        }

        .profile {
            display: none;

            margin-top: 18px;
            padding: 18px;

            border: 1px solid #252525;
            border-radius: 18px;

            background: #111111;
        }

        .profile.visible {
            display: block;
        }

        .profile-name {
            font-size: 20px;
            font-weight: 900;
        }

        .profile-id {
            margin-top: 7px;

            color: #777;

            font-size: 12px;
        }

        .profile-status {
            margin-top: 14px;

            color: #aaa;

            font-size: 12px;
        }

        .details {
            margin-top: 18px;
            padding: 14px;

            border-radius: 12px;

            background: #0d0d0d;

            color: #777;

            font-size: 11px;
            line-height: 1.6;

            word-break: break-word;
        }

        .button {
            width: 100%;

            margin-top: 18px;
            padding: 15px;

            border: 0;
            border-radius: 14px;

            background: #ffffff;
            color: #000000;

            font-size: 15px;
            font-weight: 900;
        }

        .button:active {
            transform: scale(0.98);
        }

        .footer {
            margin-top: 22px;

            color: #444;

            font-size: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="app">

    <h1>Heavy Lux Card</h1>

    <div class="subtitle">
        Telegram Mini App · диагностика соединения
    </div>


    <!-- =================================================
         DIAGNOSTICS
    ================================================== -->

    <div class="panel">

        <div class="step">

            <div class="icon">
                1
            </div>

            <div class="name">
                Telegram WebApp
            </div>

            <div
                class="result waiting"
                id="telegramStatus"
            >
                CHECKING
            </div>

        </div>


        <div class="step">

            <div class="icon">
                2
            </div>

            <div class="name">
                Telegram initData
            </div>

            <div
                class="result waiting"
                id="initDataStatus"
            >
                WAITING
            </div>

        </div>


        <div class="step">

            <div class="icon">
                3
            </div>

            <div class="name">
                Socket.IO
            </div>

            <div
                class="result waiting"
                id="socketStatus"
            >
                WAITING
            </div>

        </div>


        <div class="step">

            <div class="icon">
                4
            </div>

            <div class="name">
                Render API
            </div>

            <div
                class="result waiting"
                id="serverStatus"
            >
                WAITING
            </div>

        </div>


        <div class="step">

            <div class="icon">
                5
            </div>

            <div class="name">
                Telegram Auth
            </div>

            <div
                class="result waiting"
                id="authStatus"
            >
                WAITING
            </div>

        </div>

    </div>


    <!-- =================================================
         DETAILS
    ================================================== -->

    <div
        class="details"
        id="details"
    >
        Запуск диагностики...
    </div>


    <!-- =================================================
         PLAYER
    ================================================== -->

    <div
        class="profile"
        id="profile"
    >

        <div
            class="profile-name"
            id="profileName"
        >
            —
        </div>

        <div
            class="profile-id"
            id="profileId"
        >
            —
        </div>

        <div
            class="profile-status"
            id="profileStatus"
        >
            Авторизация выполнена
        </div>

    </div>


    <button
        class="button"
        id="reloadButton"
    >
        ПОВТОРИТЬ ПРОВЕРКУ
    </button>


    <div class="footer">
        Heavy Lux Card · Online
    </div>

</div>


<script>

(function () {

    "use strict";


    /*
    =====================================================
    ELEMENTS
    =====================================================
    */

    const telegramStatus =
        document.getElementById(
            "telegramStatus"
        );

    const initDataStatus =
        document.getElementById(
            "initDataStatus"
        );

    const socketStatus =
        document.getElementById(
            "socketStatus"
        );

    const serverStatus =
        document.getElementById(
            "serverStatus"
        );

    const authStatus =
        document.getElementById(
            "authStatus"
        );

    const details =
        document.getElementById(
            "details"
        );

    const profile =
        document.getElementById(
            "profile"
        );

    const profileName =
        document.getElementById(
            "profileName"
        );

    const profileId =
        document.getElementById(
            "profileId"
        );

    const reloadButton =
        document.getElementById(
            "reloadButton"
        );


    /*
    =====================================================
    HELPERS
    =====================================================
    */

    function setStatus(
        element,
        text,
        type
    ) {

        element.textContent = text;

        element.classList.remove(
            "ok",
            "bad",
            "waiting"
        );

        element.classList.add(type);

    }


    function showDetails(message) {

        console.log(
            "[Heavy Lux Card]",
            message
        );

        details.textContent =
            message;

    }


    /*
    =====================================================
    TELEGRAM
    =====================================================
    */

    let tg = null;

    try {

        if (
            window.Telegram &&
            window.Telegram.WebApp
        ) {

            tg =
                window.Telegram.WebApp;

        }


        if (!tg) {

            setStatus(
                telegramStatus,
                "ERROR",
                "bad"
            );

            showDetails(
                "Telegram WebApp API не найден."
            );

            return;

        }


        tg.ready();

        tg.expand();


        if (
            typeof tg.setBackgroundColor ===
            "function"
        ) {

            tg.setBackgroundColor(
                "#080808"
            );

        }


        if (
            typeof tg.setHeaderColor ===
            "function"
        ) {

            tg.setHeaderColor(
                "#080808"
            );

        }


        setStatus(
            telegramStatus,
            "OK",
            "ok"
        );


    } catch (error) {

        setStatus(
            telegramStatus,
            "ERROR",
            "bad"
        );

        showDetails(
            "Telegram WebApp error: " +
            error.message
        );

        return;

    }


    /*
    =====================================================
    TELEGRAM INIT DATA
    =====================================================
    */

    const initData =
        tg.initData;


    if (!initData) {

        setStatus(
            initDataStatus,
            "EMPTY",
            "bad"
        );

        showDetails(
            "Telegram WebApp работает, " +
            "но initData отсутствует."
        );

    } else {

        setStatus(
            initDataStatus,
            "OK",
            "ok"
        );

        showDetails(
            "Telegram initData получен."
        );

    }


    /*
    =====================================================
    SOCKET.IO
    =====================================================
    */

    if (
        typeof window.io !==
        "function"
    ) {

        setStatus(
            socketStatus,
            "NOT FOUND",
            "bad"
        );

        showDetails(
            "Socket.IO client не найден."
        );

    } else {

        try {

            const socket =
                window.io();


            socket.on(
                "connect",
                function () {

                    setStatus(
                        socketStatus,
                        "OK",
                        "ok"
                    );

                    showDetails(
                        "Socket.IO подключён. ID: " +
                        socket.id
                    );

                }
            );


            socket.on(
                "connect_error",
                function (error) {

                    setStatus(
                        socketStatus,
                        "ERROR",
                        "bad"
                    );

                    showDetails(
                        "Socket.IO error: " +
                        error.message
                    );

                }
            );


            socket.on(
                "disconnect",
                function (reason) {

                    setStatus(
                        socketStatus,
                        "OFFLINE",
                        "bad"
                    );

                    showDetails(
                        "Socket.IO disconnected: " +
                        reason
                    );

                }
            );


        } catch (error) {

            setStatus(
                socketStatus,
                "ERROR",
                "bad"
            );

            showDetails(
                "Socket.IO запуск: " +
                error.message
            );

        }

    }


    /*
    =====================================================
    SERVER HEALTH
    =====================================================
    */

    fetch(
        "/api/health",
        {
            method: "GET",
            cache: "no-store"
        }
    )

    .then(
        function (response) {

            if (!response.ok) {

                throw new Error(
                    "HTTP " +
                    response.status
                );

            }

            return response.json();

        }
    )

    .then(
        function (data) {

            if (!data.ok) {

                throw new Error(
                    "API returned ok=false"
                );

            }


            setStatus(
                serverStatus,
                "OK",
                "ok"
            );


            showDetails(
                "Render API работает. " +
                "Telegram configured: " +
                data.telegram
            );


            /*
            =============================================
            TELEGRAM AUTH
            =============================================
            */

            if (!initData) {

                setStatus(
                    authStatus,
                    "NO DATA",
                    "bad"
                );

                showDetails(
                    "Авторизация остановлена: " +
                    "Telegram initData отсутствует."
                );

                return null;

            }


            setStatus(
                authStatus,
                "CHECKING",
                "waiting"
            );


            return fetch(
                "/api/auth/telegram",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        initData:
                            initData
                    })
                }
            );

        }
    )

    .then(
        function (response) {

            if (!response) {
                return null;
            }


            return response
                .text()
                .then(
                    function (text) {

                        let data;

                        try {

                            data =
                                JSON.parse(text);

                        } catch {

                            throw new Error(
                                "Сервер вернул не JSON: " +
                                text
                            );

                        }


                        if (
                            !response.ok ||
                            !data.ok
                        ) {

                            throw new Error(
                                data.error ||
                                "Telegram auth failed"
                            );

                        }


                        return data;

                    }
                );

        }
    )

    .then(
        function (data) {

            if (!data) {
                return;
            }


            setStatus(
                authStatus,
                "OK",
                "ok"
            );


            const player =
                data.player;


            const firstName =
                player.firstName || "";

            const lastName =
                player.lastName || "";

            const username =
                player.username || "";


            const fullName =
                `${firstName} ${lastName}`
                    .trim();


            profileName.textContent =
                fullName ||
                (
                    username
                        ? "@" + username
                        : "Игрок"
                );


            profileId.textContent =
                "Telegram ID: " +
                player.telegramId;


            profile.classList.add(
                "visible"
            );


            showDetails(
                "Авторизация успешна. " +
                "Игрок: " +
                player.telegramId
            );

        }
    )

    .catch(
        function (error) {

            console.error(
                "Heavy Lux Card error:",
                error
            );


            setStatus(
                authStatus,
                "ERROR",
                "bad"
            );


            showDetails(
                "Ошибка: " +
                error.message
            );

        }
    );


    /*
    =====================================================
    RELOAD
    =====================================================
    */

    reloadButton.addEventListener(
        "click",
        function () {

            window.location.reload();

        }
    );

})();

</script>

</body>
</html>
