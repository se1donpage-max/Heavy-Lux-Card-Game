<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1,
                 maximum-scale=1,
                 user-scalable=no,
                 viewport-fit=cover"
    >

    <meta name="theme-color" content="#080808">

    <title>Heavy Lux Card</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;

            background: #080808;
            color: #ffffff;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
        }

        button {
            font: inherit;
        }

        .app {
            width: 100%;
            max-width: 520px;

            min-height: 100vh;
            min-height: 100dvh;

            margin: 0 auto;

            padding:
                calc(18px + env(safe-area-inset-top))
                16px
                calc(24px + env(safe-area-inset-bottom));
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 18px;
        }

        .logo {
            font-size: 19px;
            font-weight: 900;
            letter-spacing: -0.6px;
        }

        .connection {
            display: flex;
            align-items: center;
            gap: 6px;

            padding: 7px 10px;

            border: 1px solid #242424;
            border-radius: 999px;

            background: #101010;

            color: #777;

            font-size: 10px;
            font-weight: 800;
        }

        .connection-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #555;
        }

        .connection.online {
            color: #aaa;
        }

        .connection.online .connection-dot {
            background: #fff;
        }

        .profile-card {
            padding: 20px;

            border: 1px solid #252525;
            border-radius: 22px;

            background:
                radial-gradient(
                    circle at top right,
                    #222 0,
                    #141414 35%,
                    #101010 70%
                );

            box-shadow:
                0 20px 50px rgba(0,0,0,.35);
        }

        .profile-top {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .avatar {
            width: 58px;
            height: 58px;

            flex-shrink: 0;

            border-radius: 17px;

            background: #252525;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;
            font-weight: 900;

            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .player-name {
            font-size: 19px;
            font-weight: 900;
            line-height: 1.15;
        }

        .player-username {
            margin-top: 5px;

            color: #777;

            font-size: 12px;
        }

        .balance {
            margin-top: 22px;

            padding: 16px;

            border-radius: 16px;

            background: #0b0b0b;
        }

        .balance-label {
            color: #666;

            font-size: 10px;
            font-weight: 800;

            text-transform: uppercase;
            letter-spacing: .7px;
        }

        .balance-value {
            margin-top: 4px;

            font-size: 27px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .currency {
            color: #999;
            font-size: 15px;
            font-weight: 800;
        }

        .level-row {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-top: 17px;
        }

        .level-title {
            font-size: 14px;
            font-weight: 900;
        }

        .level-xp {
            color: #777;

            font-size: 11px;
        }

        .xp-bar {
            width: 100%;
            height: 7px;

            margin-top: 9px;

            border-radius: 999px;

            background: #242424;

            overflow: hidden;
        }

        .xp-progress {
            width: 0%;
            height: 100%;

            border-radius: inherit;

            background: #ffffff;

            transition: width .4s ease;
        }

        .stats {
            display: grid;
            grid-template-columns:
                repeat(3, 1fr);

            gap: 8px;

            margin-top: 18px;
        }

        .stat {
            padding: 13px 6px;

            border-radius: 14px;

            background: #111111;

            text-align: center;
        }

        .stat-value {
            font-size: 17px;
            font-weight: 900;
        }

        .stat-label {
            margin-top: 4px;

            color: #666;

            font-size: 9px;
            font-weight: 700;

            text-transform: uppercase;
        }

        .title-card {
            margin-top: 18px;

            padding: 14px 16px;

            border: 1px solid #252525;
            border-radius: 15px;

            background: #101010;
        }

        .title-label {
            color: #666;

            font-size: 9px;
            font-weight: 800;

            text-transform: uppercase;
        }

        .title-value {
            margin-top: 4px;

            font-size: 14px;
            font-weight: 900;
        }

        .section-title {
            margin-top: 28px;
            margin-bottom: 12px;

            font-size: 16px;
            font-weight: 900;
        }

        .game-card {
            padding: 19px;

            border: 1px solid #252525;
            border-radius: 20px;

            background:
                linear-gradient(
                    145deg,
                    #161616,
                    #0e0e0e
                );
        }

        .game-card-title {
            font-size: 21px;
            font-weight: 900;
        }

        .game-card-description {
            margin-top: 7px;

            color: #777;

            font-size: 12px;
            line-height: 1.5;
        }

        .play-button {
            width: 100%;

            margin-top: 17px;
            padding: 16px;

            border: 0;
            border-radius: 14px;

            background: #ffffff;
            color: #000000;

            font-size: 15px;
            font-weight: 900;
        }

        .play-button:active {
            transform: scale(.98);
        }

        .play-button:disabled {
            opacity: .45;
        }

        .menu {
            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 9px;

            margin-top: 10px;
        }

        .menu-button {
            padding: 14px 10px;

            border: 1px solid #252525;
            border-radius: 14px;

            background: #111111;
            color: #fff;

            font-size: 12px;
            font-weight: 800;
        }

        .menu-button:active {
            transform: scale(.98);
        }

        .status {
            margin-top: 22px;

            color: #555;

            font-size: 10px;
            text-align: center;
        }

        .error {
            color: #ff6666;
        }

        .hidden {
            display: none !important;
        }

        .loading {
            opacity: .55;
        }
    </style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            HEAVY LUX CARD
        </div>

        <div
            class="connection"
            id="connection"
        >

            <span
                class="connection-dot"
                id="connectionDot"
            ></span>

            <span id="connectionText">
                CONNECTING
            </span>

        </div>

    </div>


    <!-- PROFILE -->

    <section
        class="profile-card loading"
        id="profileCard"
    >

        <div class="profile-top">

            <div
                class="avatar"
                id="avatar"
            >
                HL
            </div>

            <div>

                <div
                    class="player-name"
                    id="playerName"
                >
                    Загрузка...
                </div>

                <div
                    class="player-username"
                    id="playerUsername"
                >
                    Авторизация
                </div>

            </div>

        </div>


        <div class="balance">

            <div class="balance-label">
                Баланс
            </div>

            <div class="balance-value">

                <span id="money">
                    10 000
                </span>

                <span class="currency">
                    HC
                </span>

            </div>

        </div>


        <div class="level-row">

            <div
                class="level-title"
                id="level"
            >
                Уровень 1
            </div>

            <div
                class="level-xp"
                id="xpText"
            >
                0 XP
            </div>

        </div>


        <div class="xp-bar">

            <div
                class="xp-progress"
                id="xpProgress"
            ></div>

        </div>


        <div class="stats">

            <div class="stat">

                <div
                    class="stat-value"
                    id="games"
                >
                    0
                </div>

                <div class="stat-label">
                    Игр
                </div>

            </div>


            <div class="stat">

                <div
                    class="stat-value"
                    id="wins"
                >
                    0
                </div>

                <div class="stat-label">
                    Побед
                </div>

            </div>


            <div class="stat">

                <div
                    class="stat-value"
                    id="losses"
                >
                    0
                </div>

                <div class="stat-label">
                    Поражений
                </div>

            </div>

        </div>


        <div class="title-card">

            <div class="title-label">
                Титул
            </div>

            <div
                class="title-value"
                id="title"
            >
                Новичок
            </div>

        </div>

    </section>


    <!-- GAME -->

    <div class="section-title">
        Игра
    </div>


    <section class="game-card">

        <div class="game-card-title">
            Дурак · 36 карт
        </div>

        <div class="game-card-description">
            Онлайн один на один.
            Только живые игроки.
            Без AI.
        </div>

        <button
            class="play-button"
            id="playButton"
            disabled
        >
            ЗАГРУЗКА...
        </button>

    </section>


    <!-- MENU -->

    <div class="section-title">
        Heavy Lux
    </div>


    <div class="menu">

        <button
            class="menu-button"
            id="garageButton"
        >
            🚘 Гараж
        </button>

        <button
            class="menu-button"
            id="motorsButton"
        >
            🏎 Heavy Motors
        </button>

        <button
            class="menu-button"
            id="propertyButton"
        >
            🏠 Недвижимость
        </button>

        <button
            class="menu-button"
            id="businessButton"
        >
            💼 Бизнес
        </button>

        <button
            class="menu-button"
            id="policeButton"
        >
            🚔 ГИБДД
        </button>

        <button
            class="menu-button"
            id="profileButton"
        >
            👤 Профиль
        </button>

    </div>


    <div
        class="status"
        id="status"
    >
        Подключение к Heavy Lux Card...
    </div>

</div>


<script>

"use strict";


/*
=========================================================
TELEGRAM
=========================================================
*/

const tg =
    window.Telegram &&
    window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;


if (tg) {

    tg.ready();

    tg.expand();


    if (
        typeof tg.setBackgroundColor ===
        "function"
    ) {

        tg.setBackgroundColor(
            "#080808"
        );

    }


    if (
        typeof tg.setHeaderColor ===
        "function"
    ) {

        tg.setHeaderColor(
            "#080808"
        );

    }

}


/*
=========================================================
ELEMENTS
=========================================================
*/

const connection =
    document.getElementById(
        "connection"
    );

const connectionText =
    document.getElementById(
        "connectionText"
    );

const profileCard =
    document.getElementById(
        "profileCard"
    );

const avatar =
    document.getElementById(
        "avatar"
    );

const playerName =
    document.getElementById(
        "playerName"
    );

const playerUsername =
    document.getElementById(
        "playerUsername"
    );

const money =
    document.getElementById(
        "money"
    );

const level =
    document.getElementById(
        "level"
    );

const xpText =
    document.getElementById(
        "xpText"
    );

const xpProgress =
    document.getElementById(
        "xpProgress"
    );

const games =
    document.getElementById(
        "games"
    );

const wins =
    document.getElementById(
        "wins"
    );

const losses =
    document.getElementById(
        "losses"
    );

const title =
    document.getElementById(
        "title"
    );

const playButton =
    document.getElementById(
        "playButton"
    );

const status =
    document.getElementById(
        "status"
    );


/*
=========================================================
PLAYER STATE
=========================================================
*/

let currentPlayer = null;


/*
=========================================================
NUMBER FORMAT
=========================================================
*/

function formatMoney(value) {

    return Number(value || 0)
        .toLocaleString("ru-RU");

}


/*
=========================================================
TITLE
=========================================================
*/

function getPlayerTitle(levelValue) {

    const value =
        Number(levelValue || 1);


    if (value >= 100) {
        return "Покровитель";
    }

    if (value >= 80) {
        return "Попечитель";
    }

    if (value >= 60) {
        return "Почётный член клуба";
    }

    if (value >= 40) {
        return "Старший член клуба";
    }

    if (value >= 20) {
        return "Член клуба";
    }

    return "Новичок";

}


/*
=========================================================
XP PROGRESS
=========================================================
*/

function getXpProgress(
    xpValue,
    levelValue
) {

    const xp =
        Number(xpValue || 0);

    const lvl =
        Number(levelValue || 1);


    if (lvl >= 100) {
        return 100;
    }


    /*
     * Пока используем простой
     * серверный XP диапазон.
     *
     * Позже вынесем точную таблицу
     * уровней на сервер.
     */

    const currentLevelXp =
        (lvl - 1) * 100;

    const nextLevelXp =
        lvl * 100;


    const progress =
        (
            (xp - currentLevelXp) /
            (nextLevelXp - currentLevelXp)
        ) * 100;


    return Math.max(
        0,
        Math.min(
            100,
            progress
        )
    );

}


/*
=========================================================
RENDER PLAYER
=========================================================
*/

function renderPlayer(player) {

    currentPlayer =
        player;


    const firstName =
        player.firstName || "";

    const lastName =
        player.lastName || "";

    const username =
        player.username || "";


    const fullName =
        `${firstName} ${lastName}`
            .trim();


    playerName.textContent =
        fullName ||
        (
            username
                ? "@" + username
                : "Игрок"
        );


    playerUsername.textContent =
        username
            ? "@" + username
            : "Игрок Heavy Lux Card";


    /*
    AVATAR
    */

    const telegramUser =
        tg?.initDataUnsafe?.user;


    if (
        telegramUser &&
        telegramUser.photo_url
    ) {

        avatar.innerHTML =
            `
            <img
                src="${telegramUser.photo_url}"
                alt=""
            >
            `;

    } else {

        const initials =
            (
                (firstName[0] || "") +
                (lastName[0] || "")
            ).toUpperCase();


        avatar.textContent =
            initials || "HL";

    }


    /*
    MONEY
    */

    money.textContent =
        formatMoney(
            player.money
        );


    /*
    LEVEL
    */

    level.textContent =
        `Уровень ${player.level}`;


    /*
    XP
    */

    xpText.textContent =
        `${player.xp} XP`;


    xpProgress.style.width =
        getXpProgress(
            player.xp,
            player.level
        ) + "%";


    /*
    STATS
    */

    games.textContent =
        player.gamesPlayed || 0;

    wins.textContent =
        player.wins || 0;

    losses.textContent =
        player.losses || 0;


    /*
    TITLE
    */

    title.textContent =
        getPlayerTitle(
            player.level
        );


    /*
    UI
    */

    profileCard.classList.remove(
        "loading"
    );


    playButton.disabled =
        false;

    playButton.textContent =
        "ИГРАТЬ";


    status.textContent =
        "Профиль загружен";

}


/*
=========================================================
TELEGRAM AUTH
=========================================================
*/

async function authenticate() {

    if (!tg) {

        status.textContent =
            "Откройте Heavy Lux Card через Telegram.";

        status.classList.add(
            "error"
        );

        return;

    }


    const initData =
        tg.initData;


    if (!initData) {

        status.textContent =
            "Telegram не передал данные.";

        status.classList.add(
            "error"
        );

        return;

    }


    try {

        status.textContent =
            "Авторизация...";


        const controller =
            new AbortController();


        const timeout =
            setTimeout(
                () => {
                    controller.abort();
                },
                10000
            );


        const response =
            await fetch(
                "/api/auth/telegram",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            initData
                        }),

                    signal:
                        controller.signal

                }
            );


        clearTimeout(timeout);


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.ok
        ) {

            throw new Error(
                data.error ||
                "Ошибка авторизации"
            );

        }


        renderPlayer(
            data.player
        );


    } catch (error) {

        console.error(
            "Authentication error:",
            error
        );


        status.textContent =
            "Ошибка авторизации: " +
            error.message;


        status.classList.add(
            "error"
        );


        profileCard.classList.remove(
            "loading"
        );

    }

}


/*
=========================================================
SOCKET.IO
=========================================================
*/

if (
    typeof window.io ===
    "function"
) {

    const socket =
        window.io({
            transports: [
                "websocket",
                "polling"
            ],

            reconnection: true,

            reconnectionAttempts:
                Infinity,

            reconnectionDelay: 1000,

            reconnectionDelayMax:
                5000
        });


    socket.on(
        "connect",
        () => {

            connection.classList.add(
                "online"
            );

            connectionText.textContent =
                "ONLINE";


            if (
                currentPlayer
            ) {

                status.textContent =
                    "Соединение с сервером установлено";

            }

        }
    );


    socket.on(
        "disconnect",
        () => {

            connection.classList.remove(
                "online"
            );

            connectionText.textContent =
                "OFFLINE";


            status.textContent =
                "Соединение потеряно. Переподключение...";

        }
    );


    socket.on(
        "connect_error",
        (error) => {

            console.error(
                "Socket.IO:",
                error
            );

            connection.classList.remove(
                "online"
            );

            connectionText.textContent =
                "RECONNECTING";

        }
    );


    socket.on(
        "server:hello",
        (data) => {

            console.log(
                "Heavy Lux Card server:",
                data
            );

        }
    );

}


/*
=========================================================
PLAY
=========================================================
*/

playButton.addEventListener(
    "click",
    () => {

        if (!currentPlayer) {

            return;

        }


        if (
            tg &&
            tg.HapticFeedback
        ) {

            tg.HapticFeedback
                .impactOccurred(
                    "medium"
                );

        }


        alert(
            "Лобби и комнаты 1×1 подключим следующим этапом."
        );

    }
);


/*
=========================================================
OTHER BUTTONS
=========================================================
*/

document
    .getElementById("garageButton")
    .addEventListener(
        "click",
        () => {

            alert(
                "Гараж подключим следующим этапом."
            );

        }
    );


document
    .getElementById("motorsButton")
    .addEventListener(
        "click",
        () => {

            alert(
                "Heavy Motors подключим следующим этапом."
            );

        }
    );


document
    .getElementById("propertyButton")
    .addEventListener(
        "click",
        () => {

            alert(
                "Недвижимость подключим следующим этапом."
            );

        }
    );


document
    .getElementById("businessButton")
    .addEventListener(
        "click",
        () => {

            alert(
                "Бизнесы подключим следующим этапом."
            );

        }
    );


document
    .getElementById("policeButton")
    .addEventListener(
        "click",
        () => {

            alert(
                "ГИБДД подключим следующим этапом."
            );

        }
    );


document
    .getElementById("profileButton")
    .addEventListener(
        "click",
        () => {

            if (!currentPlayer) {
                return;
            }


            alert(
                "Профиль игрока загружен с сервера."
            );

        }
    );


/*
=========================================================
START
=========================================================
*/

authenticate();

</script>

</body>
</html>
