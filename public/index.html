<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1,
                 maximum-scale=1,
                 user-scalable=no,
                 viewport-fit=cover"
    >

    <title>Heavy Lux Card</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: #080808;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
        }

        .app {
            width: 100%;
            max-width: 520px;
            margin: auto;
            padding: 24px 18px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 24px;
        }

        .panel {
            padding: 18px;
            border: 1px solid #252525;
            border-radius: 16px;
            background: #111;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 0;
            border-bottom: 1px solid #222;
        }

        .step:last-child {
            border-bottom: 0;
        }

        .icon {
            width: 28px;
            height: 28px;
            min-width: 28px;
            border-radius: 50%;
            background: #252525;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 13px;
            font-weight: bold;
        }

        .name {
            font-size: 14px;
            font-weight: 700;
        }

        .result {
            margin-left: auto;
            font-size: 12px;
            color: #777;
        }

        .ok {
            color: #fff;
        }

        .bad {
            color: #ff6464;
        }

        .waiting {
            color: #777;
        }

        .details {
            margin-top: 18px;
            padding: 14px;

            border-radius: 12px;
            background: #0b0b0b;

            color: #777;
            font-size: 11px;
            line-height: 1.6;

            word-break: break-word;
        }

        .profile {
            margin-top: 18px;
            padding: 18px;

            border-radius: 16px;
            background: #111;

            display: none;
        }

        .profile.visible {
            display: block;
        }

        .profile-name {
            font-size: 19px;
            font-weight: 800;
        }

        .profile-id {
            margin-top: 7px;
            color: #777;
            font-size: 12px;
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 15px;

            border: 0;
            border-radius: 12px;

            background: #fff;
            color: #000;

            font-size: 15px;
            font-weight: 800;
        }
    </style>
</head>

<body>

<div class="app">

    <h1>Heavy Lux Card</h1>

    <div class="subtitle">
        Диагностика Mini App
    </div>

    <div class="panel">

        <div class="step">
            <div class="icon">1</div>
            <div class="name">Telegram WebApp</div>
            <div
                class="result waiting"
                id="telegramStatus"
            >
                CHECKING
            </div>
        </div>

        <div class="step">
            <div class="icon">2</div>
            <div class="name">Telegram initData</div>
            <div
                class="result waiting"
                id="initDataStatus"
            >
                WAITING
            </div>
        </div>

        <div class="step">
            <div class="icon">3</div>
            <div class="name">Socket.IO</div>
            <div
                class="result waiting"
                id="socketStatus"
            >
                WAITING
            </div>
        </div>

        <div class="step">
            <div class="icon">4</div>
            <div class="name">Render API</div>
            <div
                class="result waiting"
                id="serverStatus"
            >
                WAITING
            </div>
        </div>

        <div class="step">
            <div class="icon">5</div>
            <div class="name">Telegram Auth</div>
            <div
                class="result waiting"
                id="authStatus"
            >
                WAITING
            </div>
        </div>

    </div>


    <div
        class="details"
        id="details"
    >
        Запуск диагностики...
    </div>


    <div
        class="profile"
        id="profile"
    >

        <div
            class="profile-name"
            id="profileName"
        >
            —
        </div>

        <div
            class="profile-id"
            id="profileId"
        >
            —
        </div>

    </div>


    <button
        id="reloadButton"
    >
        ПОВТОРИТЬ ПРОВЕРКУ
    </button>

</div>


<script>

(function () {

    "use strict";


    /*
    =====================================================
    ELEMENTS
    =====================================================
    */

    const telegramStatus =
        document.getElementById("telegramStatus");

    const initDataStatus =
        document.getElementById("initDataStatus");

    const socketStatus =
        document.getElementById("socketStatus");

    const serverStatus =
        document.getElementById("serverStatus");

    const authStatus =
        document.getElementById("authStatus");

    const details =
        document.getElementById("details");

    const profile =
        document.getElementById("profile");

    const profileName =
        document.getElementById("profileName");

    const profileId =
        document.getElementById("profileId");

    const reloadButton =
        document.getElementById("reloadButton");


    /*
    =====================================================
    HELPERS
    =====================================================
    */

    function setStatus(element, text, type) {

        element.textContent = text;

        element.classList.remove(
            "ok",
            "bad",
            "waiting"
        );

        element.classList.add(type);

    }


    function log(message) {

        console.log(
            "[Heavy Lux Card]",
            message
        );

        details.textContent =
            message;

    }


    /*
    =====================================================
    1. TELEGRAM WEB APP
    =====================================================
    */

    let tg = null;

    try {

        tg =
            window.Telegram &&
            window.Telegram.WebApp
                ? window.Telegram.WebApp
                : null;


        if (!tg) {

            setStatus(
                telegramStatus,
                "ERROR",
                "bad"
            );

            log(
                "Telegram WebApp API не найден. " +
                "Проверьте, что приложение открыто именно внутри Telegram."
            );

            return;

        }


        tg.ready();

        tg.expand();


        setStatus(
            telegramStatus,
            "OK",
            "ok"
        );


    } catch (error) {

        setStatus(
            telegramStatus,
            "ERROR",
            "bad"
        );

        log(
            "Ошибка Telegram WebApp: " +
            error.message
        );

        return;

    }


    /*
    =====================================================
    2. INIT DATA
    =====================================================
    */

    const initData =
        tg.initData;


    if (!initData) {

        setStatus(
            initDataStatus,
            "EMPTY",
            "bad"
        );

        log(
            "Telegram WebApp найден, но tg.initData пустой."
        );

    } else {

        setStatus(
            initDataStatus,
            "OK",
            "ok"
        );

        log(
            "Telegram initData получен."
        );

    }


    /*
    =====================================================
    3. SOCKET.IO
    =====================================================
    */

    if (
        typeof window.io !==
        "function"
    ) {

        setStatus(
            socketStatus,
            "NOT FOUND",
            "bad"
        );

        log(
            "Socket.IO client не загружен."
        );

    } else {

        try {

            const socket =
                window.io();


            socket.on(
                "connect",
                function () {

                    setStatus(
                        socketStatus,
                        "OK",
                        "ok"
                    );

                    log(
                        "Socket.IO подключён. ID: " +
                        socket.id
                    );

                }
            );


            socket.on(
                "connect_error",
                function (error) {

                    setStatus(
                        socketStatus,
                        "ERROR",
                        "bad"
                    );

                    log(
                        "Socket.IO ошибка: " +
                        error.message
                    );

                }
            );


            socket.on(
                "disconnect",
                function (reason) {

                    setStatus(
                        socketStatus,
                        "OFFLINE",
                        "bad"
                    );

                    log(
                        "Socket.IO отключён: " +
                        reason
                    );

                }
            );


        } catch (error) {

            setStatus(
                socketStatus,
                "ERROR",
                "bad"
            );

            log(
                "Не удалось запустить Socket.IO: " +
                error.message
            );

        }

    }


    /*
    =====================================================
    4. SERVER API
    =====================================================
    */

    fetch("/api/health")

        .then(function (response) {

            if (!response.ok) {

                throw new Error(
                    "HTTP " +
                    response.status
                );

            }

            return response.json();

        })

        .then(function (data) {

            if (!data.ok) {

                throw new Error(
                    "API returned ok=false"
                );

            }


            setStatus(
                serverStatus,
                "OK",
                "ok"
            );


            log(
                "Render API работает. " +
                "Telegram configured: " +
                data.telegram
            );


            /*
            =============================================
            5. TELEGRAM AUTH
            =============================================
            */

            if (!initData) {

                setStatus(
                    authStatus,
                    "NO DATA",
                    "bad"
                );

                log(
                    "Авторизацию выполнить нельзя: " +
                    "Telegram initData отсутствует."
                );

                return;

            }


            setStatus(
                authStatus,
                "CHECKING",
                "waiting"
            );


            return fetch(
                "/api/auth/telegram",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        initData: initData
                    })
                }
            );

        })

        .then(function (response) {

            if (!response) {
                return null;
            }

            return response
                .text()
                .then(function (text) {

                    let data;

                    try {

                        data =
                            JSON.parse(text);

                    } catch {

                        throw new Error(
                            "Server returned: " +
                            text
                        );

                    }


                    if (
                        !response.ok ||
                        !data.ok
                    ) {

                        throw new Error(
                            data.error ||
                            "Authorization failed"
                        );

                    }


                    return data;

                });

        })

        .then(function (data) {

            if (!data) {
                return;
            }


            setStatus(
                authStatus,
                "OK",
                "ok"
            );


            const player =
                data.player;


            const name =
                (
                    player.firstName +
                    " " +
                    player.lastName
                ).trim();


            profileName.textContent =
                name ||
                (
                    player.username
                        ? "@" + player.username
                        : "Игрок"
                );


            profileId.textContent =
                "Telegram ID: " +
                player.telegramId;


            profile.classList.add(
                "visible"
            );


            log(
                "Авторизация успешна. " +
                "Telegram ID: " +
                player.telegramId
            );

        })

        .catch(function (error) {

            setStatus(
                serverStatus,
                "ERROR",
                "bad"
            );


            setStatus(
                authStatus,
                "ERROR",
                "bad"
            );


            log(
                "ОШИБКА: " +
                error.message
            );

        });


    /*
    =====================================================
    RELOAD
    =====================================================
    */

    reloadButton.addEventListener(
        "click",
        function () {

            window.location.reload();

        }
    );

})();

</script>


<!-- Socket.IO client -->
<script src="/socket.io/socket.io.js"></script>

<script>

(function () {

    // весь основной JavaScript

})();

</script>

</body>
</html>
