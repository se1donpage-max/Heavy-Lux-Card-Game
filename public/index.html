<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="
        width=device-width,
        initial-scale=1,
        maximum-scale=1,
        user-scalable=no,
        viewport-fit=cover
    "
>

<title>Heavy Lux Card</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script src="/socket.io/socket.io.js"></script>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #080808;
    color: #fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

body {
    min-height: 100vh;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    width: 100%;
    max-width: 600px;
    min-height: 100vh;
    margin: 0 auto;
    padding:
        calc(16px + env(safe-area-inset-top))
        16px
        calc(24px + env(safe-area-inset-bottom));
}

/* =========================================================
   HEADER
========================================================= */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 20px;
}

.logo {
    font-size: 21px;
    font-weight: 900;
    letter-spacing: 1px;
}

.status {
    font-size: 12px;
    color: #888;
}

.status.online {
    color: #42e87d;
}

/* =========================================================
   CARDS
========================================================= */

.card {
    background: #111;
    border: 1px solid #252525;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 14px;
}

.card-title {
    font-size: 18px;
    font-weight: 800;
    margin-bottom: 14px;
}

/* =========================================================
   PROFILE
========================================================= */

.profile-name {
    font-size: 22px;
    font-weight: 900;
}

.profile-id {
    margin-top: 5px;
    color: #777;
    font-size: 12px;
}

/* =========================================================
   BUTTONS
========================================================= */

.btn {
    width: 100%;
    border: 0;
    border-radius: 14px;
    padding: 15px 16px;
    margin-top: 10px;

    background: #fff;
    color: #000;

    font-weight: 800;
    font-size: 15px;
}

.btn:active {
    transform: scale(.98);
}

.btn.secondary {
    background: #202020;
    color: #fff;
    border: 1px solid #333;
}

.btn.danger {
    background: #351313;
    color: #ff6b6b;
    border: 1px solid #552020;
}

/* =========================================================
   ROOMS
========================================================= */

.room {
    border: 1px solid #282828;
    background: #0c0c0c;
    border-radius: 15px;
    padding: 15px;
    margin-top: 10px;
}

.room-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.room-id {
    font-weight: 900;
    font-size: 17px;
    letter-spacing: 1px;
}

.room-status {
    color: #aaa;
    font-size: 12px;
}

.room-players {
    margin-top: 8px;
    color: #888;
    font-size: 13px;
}

.room button {
    margin-top: 12px;
}

/* =========================================================
   JOIN
========================================================= */

.join-row {
    display: flex;
    gap: 8px;
}

.join-row input {
    flex: 1;

    min-width: 0;

    border: 1px solid #333;
    background: #080808;
    color: #fff;

    border-radius: 13px;

    padding: 14px;
    outline: none;
}

.join-row button {
    width: 110px;
    margin-top: 0;
}

/* =========================================================
   ROOM
========================================================= */

.room-screen {
    display: none;
}

.room-screen.active {
    display: block;
}

.lobby-screen.hidden {
    display: none;
}

.room-code {
    text-align: center;

    font-size: 30px;
    font-weight: 900;

    letter-spacing: 4px;

    margin: 10px 0;
}

.players {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;

    margin-top: 15px;
}

.player-box {
    border: 1px solid #292929;
    background: #0b0b0b;
    border-radius: 15px;
    padding: 15px;
}

.player-label {
    color: #777;
    font-size: 11px;
    text-transform: uppercase;
}

.player-name {
    margin-top: 6px;
    font-weight: 800;
    font-size: 15px;

    overflow: hidden;
    text-overflow: ellipsis;
}

/* =========================================================
   TURN
========================================================= */

.turn-box {
    margin-top: 18px;

    border-radius: 18px;

    padding: 22px;

    text-align: center;

    border: 1px solid #292929;
    background: #0c0c0c;
}

.turn-title {
    font-size: 24px;
    font-weight: 900;
}

.turn-subtitle {
    margin-top: 7px;

    color: #777;
    font-size: 13px;
}

.turn-box.your-turn {
    border-color: #4b4b4b;
    background: #171717;
}

.turn-box.opponent-turn {
    opacity: .75;
}

/* =========================================================
   TEST GAME
========================================================= */

.test-move {
    margin-top: 15px;
}

.moves {
    margin-top: 15px;
}

.move-item {
    border-bottom: 1px solid #222;
    padding: 9px 0;

    color: #999;
    font-size: 12px;
}

/* =========================================================
   WAITING
========================================================= */

.waiting {
    text-align: center;

    color: #888;

    padding: 20px 0;
}

/* =========================================================
   TOAST
========================================================= */

.toast {
    position: fixed;

    left: 16px;
    right: 16px;
    bottom: calc(
        20px + env(safe-area-inset-bottom)
    );

    max-width: 568px;

    margin: auto;

    background: #fff;
    color: #000;

    border-radius: 14px;

    padding: 14px 16px;

    font-size: 14px;
    font-weight: 700;

    text-align: center;

    display: none;

    z-index: 999;
}

.toast.show {
    display: block;
}

/* =========================================================
   DEBUG
========================================================= */

.debug {
    margin-top: 20px;

    color: #444;

    font-size: 10px;

    word-break: break-all;
}

</style>

</head>

<body>

<div class="app">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="header">

        <div class="logo">
            HEAVY LUX CARD
        </div>

        <div
            id="connectionStatus"
            class="status"
        >
            Подключение...
        </div>

    </div>


    <!-- =====================================================
         LOBBY
    ====================================================== -->

    <div
        id="lobbyScreen"
        class="lobby-screen"
    >

        <!-- PROFILE -->

        <div class="card">

            <div class="card-title">
                Профиль
            </div>

            <div
                id="profileName"
                class="profile-name"
            >
                Загрузка...
            </div>

            <div
                id="profileId"
                class="profile-id"
            >
                —
            </div>

        </div>


        <!-- CREATE -->

        <div class="card">

            <div class="card-title">
                Игра
            </div>

            <button
                id="createRoomBtn"
                class="btn"
            >
                Создать комнату 1×1
            </button>

        </div>


        <!-- JOIN -->

        <div class="card">

            <div class="card-title">
                Войти в комнату
            </div>

            <div class="join-row">

                <input
                    id="roomInput"
                    placeholder="Код комнаты"
                    maxlength="6"
                    autocomplete="off"
                >

                <button
                    id="joinRoomBtn"
                    class="btn"
                >
                    Войти
                </button>

            </div>

        </div>


        <!-- ROOMS -->

        <div class="card">

            <div class="card-title">
                Комнаты
            </div>

            <div id="roomsList">
                Загрузка...
            </div>

        </div>

    </div>


    <!-- =====================================================
         ROOM
    ====================================================== -->

    <div
        id="roomScreen"
        class="room-screen"
    >

        <div class="card">

            <div class="card-title">
                Комната
            </div>

            <div
                id="roomCode"
                class="room-code"
            >
                ------
            </div>

            <div
                id="roomStatus"
                class="waiting"
            >
                Ожидание игрока...
            </div>


            <!-- PLAYERS -->

            <div
                id="playersContainer"
                class="players"
            >
            </div>


            <!-- TURN -->

            <div
                id="turnBox"
                class="turn-box"
            >

                <div
                    id="turnTitle"
                    class="turn-title"
                >
                    Ожидание
                </div>

                <div
                    id="turnSubtitle"
                    class="turn-subtitle"
                >
                    Подождите второго игрока
                </div>

            </div>


            <!-- TEST MOVE -->

            <button
                id="testMoveBtn"
                class="btn test-move"
                style="display:none;"
            >
                Сделать тестовый ход
            </button>


            <!-- MOVES -->

            <div
                id="moves"
                class="moves"
            >
            </div>


            <!-- LEAVE -->

            <button
                id="leaveRoomBtn"
                class="btn danger"
            >
                Покинуть комнату
            </button>

        </div>

    </div>


    <div
        id="debug"
        class="debug"
    >
    </div>

</div>


<div
    id="toast"
    class="toast"
>
</div>


<script>

/* =========================================================
   TELEGRAM
========================================================= */

const tg =
    window.Telegram?.WebApp || null;

if (tg) {
    tg.ready();
    tg.expand();
}


/* =========================================================
   SOCKET
========================================================= */

let socket = null;

let currentProfile = null;
let currentRoom = null;


/* =========================================================
   DOM
========================================================= */

const lobbyScreen =
    document.getElementById(
        "lobbyScreen"
    );

const roomScreen =
    document.getElementById(
        "roomScreen"
    );

const profileName =
    document.getElementById(
        "profileName"
    );

const profileId =
    document.getElementById(
        "profileId"
    );

const roomsList =
    document.getElementById(
        "roomsList"
    );

const connectionStatus =
    document.getElementById(
        "connectionStatus"
    );

const roomCode =
    document.getElementById(
        "roomCode"
    );

const roomStatus =
    document.getElementById(
        "roomStatus"
    );

const playersContainer =
    document.getElementById(
        "playersContainer"
    );

const turnBox =
    document.getElementById(
        "turnBox"
    );

const turnTitle =
    document.getElementById(
        "turnTitle"
    );

const turnSubtitle =
    document.getElementById(
        "turnSubtitle"
    );

const testMoveBtn =
    document.getElementById(
        "testMoveBtn"
    );

const moves =
    document.getElementById(
        "moves"
    );

const debug =
    document.getElementById(
        "debug"
    );

const toast =
    document.getElementById(
        "toast"
    );


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;

function showToast(message) {

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {

        toast.classList.remove(
            "show"
        );

    }, 3000);
}


/* =========================================================
   TELEGRAM AUTH
========================================================= */

function getSocketAuth() {

    const auth = {};

    if (
        tg &&
        tg.initData
    ) {

        auth.initData =
            tg.initData;

    }

    /*
        Для тестирования вне Telegram
        создаём постоянный test ID
        в localStorage.
    */

    if (!auth.initData) {

        let testPlayerId =
            localStorage.getItem(
                "hlc_test_player"
            );

        if (!testPlayerId) {

            testPlayerId =
                "test_" +
                Math.random()
                    .toString(36)
                    .slice(2, 10);

            localStorage.setItem(
                "hlc_test_player",
                testPlayerId
            );
        }

        auth.testPlayerId =
            testPlayerId;
    }

    return auth;
}


/* =========================================================
   CONNECT
========================================================= */

function connectSocket() {

    if (socket) {

        socket.disconnect();

    }

    socket = io(
        window.location.origin,
        {
            auth: getSocketAuth(),

            transports: [
                "websocket",
                "polling"
            ],

            reconnection: true,

            reconnectionAttempts: Infinity,

            reconnectionDelay: 1000,

            reconnectionDelayMax: 5000,

            timeout: 10000
        }
    );


    /* =====================================================
       CONNECTED
    ====================================================== */

    socket.on(
        "connect",
        () => {

            connectionStatus.textContent =
                "Онлайн";

            connectionStatus.classList.add(
                "online"
            );

            socket.emit(
                "get_profile"
            );

            socket.emit(
                "get_rooms"
            );

            /*
                Если UI уже был в комнате,
                сервер сам отправит game_state.
            */

        }
    );


    /* =====================================================
       DISCONNECTED
    ====================================================== */

    socket.on(
        "disconnect",
        () => {

            connectionStatus.textContent =
                "Переподключение...";

            connectionStatus.classList.remove(
                "online"
            );

        }
    );


    /* =====================================================
       CONNECT ERROR
    ====================================================== */

    socket.on(
        "connect_error",
        (error) => {

            console.error(
                "Socket error:",
                error
            );

            connectionStatus.textContent =
                "Ошибка подключения";

        }
    );


    /* =====================================================
       PROFILE
    ====================================================== */

    socket.on(
        "profile",
        (profile) => {

            currentProfile =
                profile;

            profileName.textContent =
                profile.name ||
                "Игрок";

            profileId.textContent =
                "ID: " +
                profile.playerId;

        }
    );


    /* =====================================================
       ROOMS
    ====================================================== */

    socket.on(
        "rooms_list",
        (rooms) => {

            renderRooms(
                rooms
            );

        }
    );


    /* =====================================================
       ROOM CREATED
    ====================================================== */

    socket.on(
        "room_created",
        (room) => {

            showRoom();

            roomCode.textContent =
                room.id;

            roomStatus.textContent =
                "Ожидание второго игрока...";

            showToast(
                "Комната создана"
            );

        }
    );


    /* =====================================================
       GAME STATE
    ====================================================== */

    socket.on(
        "game_state",
        (state) => {

            console.log(
                "GAME STATE:",
                state
            );

            currentRoom =
                state;

            showRoom();

            renderGameState(
                state
            );

        }
    );


    /* =====================================================
       ERRORS
    ====================================================== */

    socket.on(
        "error_message",
        (message) => {

            showToast(
                message
            );

        }
    );


    socket.on(
        "move_error",
        (message) => {

            showToast(
                message
            );

        }
    );


    /* =====================================================
       LEFT ROOM
    ====================================================== */

    socket.on(
        "left_room",
        () => {

            currentRoom =
                null;

            showLobby();

            socket.emit(
                "get_rooms"
            );

        }
    );

}


/* =========================================================
   RENDER ROOMS
========================================================= */

function renderRooms(roomList) {

    if (!roomList.length) {

        roomsList.innerHTML =
            `
            <div class="waiting">
                Сейчас нет комнат
            </div>
            `;

        return;

    }

    roomsList.innerHTML = "";

    roomList.forEach(
        (room) => {

            const element =
                document.createElement(
                    "div"
                );

            element.className =
                "room";

            const status =
                room.status === "waiting"
                    ? "Ожидание игрока"
                    : "Игра идёт";

            const disabled =
                room.playersCount >= 2 ||
                room.status !== "waiting";

            element.innerHTML =
                `
                <div class="room-top">

                    <div class="room-id">
                        ${escapeHtml(room.id)}
                    </div>

                    <div class="room-status">
                        ${status}
                    </div>

                </div>

                <div class="room-players">
                    Игроков:
                    ${room.playersCount}/2
                </div>

                <button
                    class="btn secondary"
                    ${disabled ? "disabled" : ""}
                >
                    Войти
                </button>
                `;

            const button =
                element.querySelector(
                    "button"
                );

            if (!disabled) {

                button.addEventListener(
                    "click",
                    () => {

                        socket.emit(
                            "join_room",
                            room.id
                        );

                    }
                );

            }

            roomsList.appendChild(
                element
            );

        }
    );

}


/* =========================================================
   SHOW ROOM
========================================================= */

function showRoom() {

    lobbyScreen.classList.add(
        "hidden"
    );

    roomScreen.classList.add(
        "active"
    );

}


/* =========================================================
   SHOW LOBBY
========================================================= */

function showLobby() {

    roomScreen.classList.remove(
        "active"
    );

    lobbyScreen.classList.remove(
        "hidden"
    );

}


/* =========================================================
   RENDER GAME STATE
========================================================= */

function renderGameState(state) {

    roomCode.textContent =
        state.roomId || "------";


    /* =====================================================
       STATUS
    ====================================================== */

    if (
        state.status ===
        "waiting"
    ) {

        roomStatus.textContent =
            "Ожидание второго игрока...";

    } else if (
        state.status ===
        "playing"
    ) {

        roomStatus.textContent =
            "Игра началась";

    } else {

        roomStatus.textContent =
            "Игра завершена";

    }


    /* =====================================================
       PLAYERS
    ====================================================== */

    playersContainer.innerHTML =
        "";

    if (state.me) {

        playersContainer.innerHTML +=
            `
            <div class="player-box">

                <div class="player-label">
                    Вы
                </div>

                <div class="player-name">
                    ${escapeHtml(
                        state.me.name
                    )}
                </div>

            </div>
            `;

    }

    if (state.opponent) {

        playersContainer.innerHTML +=
            `
            <div class="player-box">

                <div class="player-label">
                    Противник
                </div>

                <div class="player-name">
                    ${escapeHtml(
                        state.opponent.name
                    )}
                </div>

            </div>
            `;

    } else {

        playersContainer.innerHTML +=
            `
            <div class="player-box">

                <div class="player-label">
                    Противник
                </div>

                <div class="player-name">
                    Ожидание...
                </div>

            </div>
            `;

    }


    /* =====================================================
       TURN
    ====================================================== */

    turnBox.classList.remove(
        "your-turn",
        "opponent-turn"
    );


    if (
        state.turn ===
        "YOUR_TURN"
    ) {

        turnBox.classList.add(
            "your-turn"
        );

        turnTitle.textContent =
            "ВАШ ХОД";

        turnSubtitle.textContent =
            "Сервер разрешил вам сделать ход";

        testMoveBtn.style.display =
            "block";

        testMoveBtn.disabled =
            false;

    } else if (
        state.turn ===
        "OPPONENT_TURN"
    ) {

        turnBox.classList.add(
            "opponent-turn"
        );

        turnTitle.textContent =
            "ХОД ПРОТИВНИКА";

        turnSubtitle.textContent =
            "Ожидайте действия другого игрока";

        testMoveBtn.style.display =
            "block";

        testMoveBtn.disabled =
            true;

    } else {

        turnTitle.textContent =
            "ОЖИДАНИЕ";

        turnSubtitle.textContent =
            "Ожидайте второго игрока";

        testMoveBtn.style.display =
            "none";

    }


    /* =====================================================
       MOVES
    ====================================================== */

    moves.innerHTML =
        "";

    if (
        !state.moves ||
        !state.moves.length
    ) {

        return;

    }

    state.moves.forEach(
        (move, index) => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "move-item";

            const who =
                move.playerId ===
                state.me?.playerId
                    ? "Вы"
                    : "Противник";

            div.textContent =
                `${index + 1}. ${who} сделал ход`;

            moves.appendChild(
                div
            );

        }
    );


    /* =====================================================
       DEBUG
    ====================================================== */

    debug.textContent =
        `room=${state.roomId} | ` +
        `status=${state.status} | ` +
        `turn=${state.turn} | ` +
        `turnPlayerId=${state.turnPlayerId}`;

}


/* =========================================================
   CREATE ROOM
========================================================= */

document
    .getElementById(
        "createRoomBtn"
    )
    .addEventListener(
        "click",
        () => {

            if (
                !socket ||
                !socket.connected
            ) {

                showToast(
                    "Socket.IO ещё не подключён"
                );

                return;

            }

            socket.emit(
                "create_room"
            );

        }
    );


/* =========================================================
   JOIN ROOM
========================================================= */

document
    .getElementById(
        "joinRoomBtn"
    )
    .addEventListener(
        "click",
        () => {

            const input =
                document.getElementById(
                    "roomInput"
                );

            const roomId =
                input.value
                    .trim()
                    .toUpperCase();

            if (!roomId) {

                showToast(
                    "Введите код комнаты"
                );

                return;

            }

            socket.emit(
                "join_room",
                roomId
            );

        }
    );


/* =========================================================
   ENTER KEY
========================================================= */

document
    .getElementById(
        "roomInput"
    )
    .addEventListener(
        "keydown",
        (event) => {

            if (
                event.key ===
                "Enter"
            ) {

                document
                    .getElementById(
                        "joinRoomBtn"
                    )
                    .click();

            }

        }
    );


/* =========================================================
   TEST MOVE
========================================================= */

testMoveBtn.addEventListener(
    "click",
    () => {

        if (
            !currentRoom ||
            currentRoom.turn !==
            "YOUR_TURN"
        ) {

            showToast(
                "Сейчас не ваш ход"
            );

            return;

        }

        /*
            Это пока тестовый ход.

            Позже здесь будет:

                socket.emit(
                    "play_card",
                    {
                        card: ...
                    }
                );
        */

        socket.emit(
            "make_move",
            {
                type: "test"
            }
        );

    }
);


/* =========================================================
   LEAVE
========================================================= */

document
    .getElementById(
        "leaveRoomBtn"
    )
    .addEventListener(
        "click",
        () => {

            if (!socket) {
                return;
            }

            socket.emit(
                "leave_room"
            );

        }
    );


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   START
========================================================= */

connectSocket();

</script>
