<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no,
             viewport-fit=cover"
>

<title>Heavy Lux Card</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script src="/socket.io/socket.io.js"></script>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    min-height: 100%;

    background: #070707;
    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

body {
    min-height: 100vh;
}

button,
input {
    font: inherit;
}

button {
    border: 0;
}

.app {
    width: 100%;
    max-width: 600px;

    min-height: 100vh;

    margin: auto;

    padding:
        calc(18px + env(safe-area-inset-top))
        16px
        calc(25px + env(safe-area-inset-bottom));
}

/*
=========================================================
HEADER
=========================================================
*/

.header {
    display: flex;

    justify-content: space-between;
    align-items: center;

    margin-bottom: 20px;
}

.logo {
    font-size: 20px;
    font-weight: 900;

    letter-spacing: 1px;
}

.connection {
    font-size: 12px;
    color: #777;
}

.connection.online {
    color: #5cff91;
}

/*
=========================================================
CARD
=========================================================
*/

.card {
    background: #111;

    border: 1px solid #242424;

    border-radius: 18px;

    padding: 18px;

    margin-bottom: 14px;
}

.title {
    font-size: 18px;
    font-weight: 900;

    margin-bottom: 14px;
}

/*
=========================================================
PROFILE
=========================================================
*/

.profile-name {
    font-size: 23px;
    font-weight: 900;
}

.profile-id {
    margin-top: 5px;

    font-size: 11px;

    color: #666;
}

/*
=========================================================
BUTTON
=========================================================
*/

.btn {
    width: 100%;

    padding: 15px;

    margin-top: 10px;

    border-radius: 14px;

    background: #fff;
    color: #000;

    font-size: 15px;
    font-weight: 900;
}

.btn:active {
    transform: scale(.98);
}

.btn.secondary {
    background: #1d1d1d;
    color: #fff;

    border: 1px solid #303030;
}

.btn.danger {
    background: #2a1010;
    color: #ff6666;

    border: 1px solid #451818;
}

.btn:disabled {
    opacity: .35;
}

/*
=========================================================
JOIN
=========================================================
*/

.join {
    display: flex;

    gap: 8px;
}

.join input {
    flex: 1;

    min-width: 0;

    padding: 14px;

    border-radius: 13px;

    border: 1px solid #303030;

    outline: none;

    background: #080808;

    color: #fff;

    text-transform: uppercase;
}

.join .btn {
    width: 105px;

    margin-top: 0;
}

/*
=========================================================
ROOMS
=========================================================
*/

.room {
    padding: 15px;

    margin-top: 10px;

    border-radius: 14px;

    background: #0b0b0b;

    border: 1px solid #292929;
}

.room-head {
    display: flex;

    justify-content: space-between;
}

.room-code {
    font-size: 18px;
    font-weight: 900;

    letter-spacing: 2px;
}

.room-info {
    margin-top: 7px;

    font-size: 12px;

    color: #777;
}

/*
=========================================================
SCREENS
=========================================================
*/

.room-screen {
    display: none;
}

.room-screen.active {
    display: block;
}

.lobby.hidden {
    display: none;
}

/*
=========================================================
BIG ROOM CODE
=========================================================
*/

.big-code {
    text-align: center;

    font-size: 31px;
    font-weight: 900;

    letter-spacing: 5px;

    margin: 10px 0 18px;
}

.center {
    text-align: center;
}

/*
=========================================================
PLAYERS
=========================================================
*/

.players {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;
}

.player {
    background: #0b0b0b;

    border: 1px solid #282828;

    border-radius: 15px;

    padding: 14px;
}

.player-label {
    color: #666;

    font-size: 10px;

    text-transform: uppercase;
}

.player-name {
    margin-top: 7px;

    font-size: 15px;

    font-weight: 800;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}

/*
=========================================================
TURN
=========================================================
*/

.turn {
    margin-top: 18px;

    padding: 23px 15px;

    text-align: center;

    border-radius: 18px;

    border: 1px solid #292929;

    background: #0b0b0b;
}

.turn.your {
    background: #171717;

    border-color: #555;
}

.turn.opponent {
    opacity: .75;
}

.turn-title {
    font-size: 25px;

    font-weight: 900;
}

.turn-description {
    margin-top: 7px;

    color: #777;

    font-size: 12px;
}

/*
=========================================================
MOVES
=========================================================
*/

.moves {
    margin-top: 15px;
}

.move {
    padding: 9px 0;

    border-bottom:
        1px solid #222;

    color: #888;

    font-size: 12px;
}

/*
=========================================================
WAITING
=========================================================
*/

.waiting {
    padding: 20px 0;

    text-align: center;

    color: #777;
}

/*
=========================================================
TOAST
=========================================================
*/

.toast {
    position: fixed;

    left: 15px;
    right: 15px;

    bottom:
        calc(
            18px +
            env(safe-area-inset-bottom)
        );

    padding: 14px;

    border-radius: 14px;

    background: #fff;
    color: #000;

    font-size: 14px;
    font-weight: 800;

    text-align: center;

    display: none;

    z-index: 1000;
}

.toast.show {
    display: block;
}

</style>

</head>

<body>

<div class="app">

    <div class="header">

        <div class="logo">
            HEAVY LUX CARD
        </div>

        <div
            id="connection"
            class="connection"
        >
            Подключение...
        </div>

    </div>


    <!-- =================================================
         LOBBY
    ================================================== -->

    <div
        id="lobby"
        class="lobby"
    >

        <div class="card">

            <div class="title">
                Профиль
            </div>

            <div
                id="profileName"
                class="profile-name"
            >
                Загрузка...
            </div>

            <div
                id="profileId"
                class="profile-id"
            >
                —
            </div>

        </div>


        <div class="card">

            <div class="title">
                Онлайн-игра
            </div>

            <button
                id="createBtn"
                class="btn"
            >
                Создать комнату 1×1
            </button>

        </div>


        <div class="card">

            <div class="title">
                Войти по коду
            </div>

            <div class="join">

                <input
                    id="roomInput"
                    maxlength="6"
                    placeholder="КОД"
                    autocomplete="off"
                >

                <button
                    id="joinBtn"
                    class="btn"
                >
                    Войти
                </button>

            </div>

        </div>


        <div class="card">

            <div class="title">
                Комнаты
            </div>

            <div id="rooms">
                <div class="waiting">
                    Загрузка комнат...
                </div>
            </div>

        </div>

    </div>


    <!-- =================================================
         ROOM
    ================================================== -->

    <div
        id="roomScreen"
        class="room-screen"
    >

        <div class="card">

            <div class="title">
                Комната 1×1
            </div>

            <div
                id="bigCode"
                class="big-code"
            >
                ------
            </div>

            <div
                id="roomStatus"
                class="center"
            >
                Ожидание игрока...
            </div>

            <div
                id="players"
                class="players"
                style="margin-top:16px;"
            >
            </div>


            <div
                id="turn"
                class="turn"
            >

                <div
                    id="turnTitle"
                    class="turn-title"
                >
                    ОЖИДАНИЕ
                </div>

                <div
                    id="turnDescription"
                    class="turn-description"
                >
                    Ожидаем второго игрока
                </div>

            </div>


            <button
                id="moveBtn"
                class="btn"
                style="display:none;"
            >
                Сделать тестовый ход
            </button>


            <div
                id="moves"
                class="moves"
            >
            </div>


            <button
                id="leaveBtn"
                class="btn danger"
            >
                Покинуть комнату
            </button>

        </div>

    </div>

</div>


<div
    id="toast"
    class="toast"
></div>


<script>

/*
=========================================================
TELEGRAM
=========================================================
*/

const telegram =
    window.Telegram?.WebApp || null;

if (telegram) {
    telegram.ready();
    telegram.expand();
}


/*
=========================================================
VARIABLES
=========================================================
*/

let socket = null;

let profile = null;

let currentGame = null;


/*
=========================================================
DOM
=========================================================
*/

const lobby =
    document.getElementById(
        "lobby"
    );

const roomScreen =
    document.getElementById(
        "roomScreen"
    );

const connection =
    document.getElementById(
        "connection"
    );

const profileName =
    document.getElementById(
        "profileName"
    );

const profileId =
    document.getElementById(
        "profileId"
    );

const rooms =
    document.getElementById(
        "rooms"
    );

const bigCode =
    document.getElementById(
        "bigCode"
    );

const roomStatus =
    document.getElementById(
        "roomStatus"
    );

const players =
    document.getElementById(
        "players"
    );

const turn =
    document.getElementById(
        "turn"
    );

const turnTitle =
    document.getElementById(
        "turnTitle"
    );

const turnDescription =
    document.getElementById(
        "turnDescription"
    );

const moveBtn =
    document.getElementById(
        "moveBtn"
    );

const moves =
    document.getElementById(
        "moves"
    );

const toast =
    document.getElementById(
        "toast"
    );


/*
=========================================================
TOAST
=========================================================
*/

let toastTimeout = null;

function showToast(text) {

    toast.textContent = text;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimeout
    );

    toastTimeout =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            3000
        );
}


/*
=========================================================
SOCKET AUTH
=========================================================
*/

function socketAuth() {

    const auth = {};

    if (
        telegram &&
        telegram.initData
    ) {

        auth.initData =
            telegram.initData;

    } else {

        let testId =
            localStorage.getItem(
                "hlc_test_id"
            );

        if (!testId) {

            testId =
                "test_" +
                Math.random()
                    .toString(36)
                    .slice(2, 10);

            localStorage.setItem(
                "hlc_test_id",
                testId
            );
        }

        auth.testPlayerId =
            testId;
    }

    return auth;
}


/*
=========================================================
CONNECT
=========================================================
*/

function connect() {

    socket =
        io(
            window.location.origin,
            {
                auth:
                    socketAuth(),

                transports: [
                    "websocket",
                    "polling"
                ],

                reconnection: true,

                reconnectionAttempts:
                    Infinity,

                reconnectionDelay:
                    1000,

                reconnectionDelayMax:
                    5000,

                timeout:
                    10000
            }
        );


    /*
    CONNECT
    */

    socket.on(
        "connect",
        () => {

            connection.textContent =
                "Онлайн";

            connection.classList.add(
                "online"
            );

            socket.emit(
                "get_profile"
            );

            socket.emit(
                "get_rooms"
            );
        }
    );


    /*
    DISCONNECT
    */

    socket.on(
        "disconnect",
        () => {

            connection.textContent =
                "Переподключение...";

            connection.classList.remove(
                "online"
            );
        }
    );


    /*
    ERROR
    */

    socket.on(
        "connect_error",
        (error) => {

            console.error(
                error
            );

            connection.textContent =
                "Ошибка Socket.IO";

            connection.classList.remove(
                "online"
            );
        }
    );


    /*
    PROFILE
    */

    socket.on(
        "profile",
        (data) => {

            profile =
                data;

            profileName.textContent =
                data.name ||
                "Игрок";

            profileId.textContent =
                "ID: " +
                data.playerId;
        }
    );


    /*
    ROOM LIST
    */

    socket.on(
        "rooms_list",
        (list) => {

            renderRooms(
                list
            );
        }
    );


    /*
    ROOM CREATED
    */

    socket.on(
        "room_created",
        (room) => {

            openRoom();

            bigCode.textContent =
                room.id;

            showToast(
                "Комната создана"
            );
        }
    );


    /*
    GAME STATE
    */

    socket.on(
        "game_state",
        (state) => {

            currentGame =
                state;

            openRoom();

            renderGame(
                state
            );

            console.log(
                "GAME STATE",
                state
            );
        }
    );


    /*
    SERVER ERROR
    */

    socket.on(
        "error_message",
        (message) => {

            showToast(
                message
            );
        }
    );


    /*
    MOVE ERROR
    */

    socket.on(
        "move_error",
        (message) => {

            showToast(
                message
            );
        }
    );


    /*
    LEFT ROOM
    */

    socket.on(
        "left_room",
        () => {

            currentGame =
                null;

            closeRoom();

            socket.emit(
                "get_rooms"
            );
        }
    );
}


/*
=========================================================
ROOM LIST
=========================================================
*/

function renderRooms(list) {

    if (!list.length) {

        rooms.innerHTML =
            `
            <div class="waiting">
                Нет доступных комнат
            </div>
            `;

        return;
    }

    rooms.innerHTML = "";

    list.forEach(
        (room) => {

            const element =
                document.createElement(
                    "div"
                );

            element.className =
                "room";

            const full =
                room.playersCount >= 2;

            const playing =
                room.status ===
                "playing";

            element.innerHTML =
                `
                <div class="room-head">

                    <div class="room-code">
                        ${escapeHtml(room.id)}
                    </div>

                    <div>
                        ${room.playersCount}/2
                    </div>

                </div>

                <div class="room-info">
                    ${
                        playing
                            ? "Игра идёт"
                            : "Ожидание игрока"
                    }
                </div>

                <button
                    class="btn secondary"
                    ${
                        full || playing
                            ? "disabled"
                            : ""
                    }
                >
                    Войти
                </button>
                `;

            const button =
                element.querySelector(
                    "button"
                );

            if (
                !full &&
                !playing
            ) {

                button.addEventListener(
                    "click",
                    () => {

                        socket.emit(
                            "join_room",
                            room.id
                        );
                    }
                );
            }

            rooms.appendChild(
                element
            );
        }
    );
}


/*
=========================================================
OPEN ROOM
=========================================================
*/

function openRoom() {

    lobby.classList.add(
        "hidden"
    );

    roomScreen.classList.add(
        "active"
    );
}


/*
=========================================================
CLOSE ROOM
=========================================================
*/

function closeRoom() {

    roomScreen.classList.remove(
        "active"
    );

    lobby.classList.remove(
        "hidden"
    );
}


/*
=========================================================
RENDER GAME
=========================================================
*/

function renderGame(state) {

    bigCode.textContent =
        state.roomId;


    /*
    STATUS
    */

    if (
        state.status ===
        "waiting"
    ) {

        roomStatus.textContent =
            "Ожидание второго игрока...";

    } else {

        roomStatus.textContent =
            "Игра началась";
    }


    /*
    PLAYERS
    */

    players.innerHTML = "";


    if (state.me) {

        players.innerHTML +=
            `
            <div class="player">

                <div class="player-label">
                    Вы
                </div>

                <div class="player-name">
                    ${escapeHtml(
                        state.me.name
                    )}
                </div>

            </div>
            `;
    }


    if (state.opponent) {

        players.innerHTML +=
            `
            <div class="player">

                <div class="player-label">
                    Противник
                </div>

                <div class="player-name">
                    ${escapeHtml(
                        state.opponent.name
                    )}
                </div>

            </div>
            `;

    } else {

        players.innerHTML +=
            `
            <div class="player">

                <div class="player-label">
                    Противник
                </div>

                <div class="player-name">
                    Ожидание...
                </div>

            </div>
            `;
    }


    /*
    TURN
    */

    turn.classList.remove(
        "your",
        "opponent"
    );


    if (
        state.turn ===
        "YOUR_TURN"
    ) {

        turn.classList.add(
            "your"
        );

        turnTitle.textContent =
            "ВАШ ХОД";

        turnDescription.textContent =
            "Сейчас вы можете сделать ход";

        moveBtn.style.display =
            "block";

        moveBtn.disabled =
            false;

    } else if (
        state.turn ===
        "OPPONENT_TURN"
    ) {

        turn.classList.add(
            "opponent"
        );

        turnTitle.textContent =
            "ХОД ПРОТИВНИКА";

        turnDescription.textContent =
            "Ожидайте действия противника";

        moveBtn.style.display =
            "block";

        moveBtn.disabled =
            true;

    } else {

        turnTitle.textContent =
            "ОЖИДАНИЕ";

        turnDescription.textContent =
            "Ожидаем второго игрока";

        moveBtn.style.display =
            "none";
    }


    /*
    MOVES
    */

    moves.innerHTML = "";

    if (
        state.moves &&
        state.moves.length
    ) {

        state.moves.forEach(
            (move, index) => {

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "move";

                const who =
                    move.playerId ===
                    state.me?.playerId
                        ? "Вы"
                        : "Противник";

                item.textContent =
                    `${index + 1}. ${who} сделал ход`;

                moves.appendChild(
                    item
                );
            }
        );
    }
}


/*
=========================================================
CREATE
=========================================================
*/

document
    .getElementById(
        "createBtn"
    )
    .addEventListener(
        "click",
        () => {

            if (
                !socket ||
                !socket.connected
            ) {

                showToast(
                    "Socket.IO не подключён"
                );

                return;
            }

            socket.emit(
                "create_room"
            );
        }
    );


/*
=========================================================
JOIN
=========================================================
*/

document
    .getElementById(
        "joinBtn"
    )
    .addEventListener(
        "click",
        () => {

            const input =
                document.getElementById(
                    "roomInput"
                );

            const code =
                input.value
                    .trim()
                    .toUpperCase();

            if (!code) {

                showToast(
                    "Введите код комнаты"
                );

                return;
            }

            socket.emit(
                "join_room",
                code
            );
        }
    );


/*
=========================================================
ENTER
=========================================================
*/

document
    .getElementById(
        "roomInput"
    )
    .addEventListener(
        "keydown",
        (event) => {

            if (
                event.key ===
                "Enter"
            ) {

                document
                    .getElementById(
                        "joinBtn"
                    )
                    .click();
            }
        }
    );


/*
=========================================================
TEST MOVE
=========================================================
*/

moveBtn.addEventListener(
    "click",
    () => {

        if (
            !currentGame
        ) {
            return;
        }

        if (
            currentGame.turn !==
            "YOUR_TURN"
        ) {

            showToast(
                "Сейчас не ваш ход"
            );

            return;
        }

        socket.emit(
            "make_move",
            {
                type:
                    "test"
            }
        );
    }
);


/*
=========================================================
LEAVE
=========================================================
*/

document
    .getElementById(
        "leaveBtn"
    )
    .addEventListener(
        "click",
        () => {

            if (
                socket &&
                socket.connected
            ) {

                socket.emit(
                    "leave_room"
                );
            }
        }
    );


/*
=========================================================
ESCAPE
=========================================================
*/

function escapeHtml(value) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


/*
=========================================================
START
=========================================================
*/

connect();

</script>

</body>
</html>
