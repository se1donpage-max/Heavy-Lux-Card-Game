<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no,
             viewport-fit=cover"
>

<title>Heavy Lux Card</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script src="/socket.io/socket.io.js"></script>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    min-height: 100%;

    background: #070707;
    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

body {
    min-height: 100vh;
}

button,
input {
    font: inherit;
}

button {
    border: 0;
}

.app {
    width: 100%;
    max-width: 620px;

    min-height: 100vh;

    margin: auto;

    padding:
        calc(16px + env(safe-area-inset-top))
        14px
        calc(25px + env(safe-area-inset-bottom));
}

/*
=========================================================
HEADER
=========================================================
*/

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 15px;
}

.logo {
    font-size: 19px;
    font-weight: 900;
    letter-spacing: 1px;
}

.connection {
    font-size: 11px;
    color: #777;
}

.connection.online {
    color: #5cff91;
}

/*
=========================================================
CARD
=========================================================
*/

.card {
    background: #111;

    border: 1px solid #242424;

    border-radius: 18px;

    padding: 16px;

    margin-bottom: 12px;
}

.title {
    font-size: 17px;
    font-weight: 900;

    margin-bottom: 13px;
}

/*
=========================================================
BUTTONS
=========================================================
*/

.btn {
    width: 100%;

    padding: 14px;

    margin-top: 9px;

    border-radius: 13px;

    background: #fff;
    color: #000;

    font-weight: 900;

    cursor: pointer;
}

.btn.secondary {
    background: #1d1d1d;
    color: #fff;

    border: 1px solid #303030;
}

.btn.danger {
    background: #2a1010;
    color: #ff6666;

    border: 1px solid #451818;
}

.btn.take {
    background: #401313;
    color: #ff7777;

    border: 1px solid #642020;
}

.btn.beat {
    background: #fff;
    color: #000;
}

.btn:disabled {
    opacity: .35;
}

/*
=========================================================
PROFILE
=========================================================
*/

.profile-name {
    font-size: 23px;
    font-weight: 900;
}

.profile-id {
    margin-top: 4px;

    color: #666;
    font-size: 10px;
}

/*
=========================================================
JOIN
=========================================================
*/

.join {
    display: flex;
    gap: 8px;
}

.join input {
    flex: 1;

    min-width: 0;

    padding: 13px;

    border-radius: 13px;

    border: 1px solid #303030;

    outline: none;

    background: #080808;
    color: #fff;

    text-transform: uppercase;
}

.join .btn {
    width: 100px;
    margin-top: 0;
}

/*
=========================================================
ROOMS
=========================================================
*/

.room {
    padding: 13px;

    margin-top: 9px;

    border-radius: 13px;

    background: #0b0b0b;

    border: 1px solid #292929;
}

.room-head {
    display: flex;
    justify-content: space-between;
}

.room-code {
    font-size: 18px;
    font-weight: 900;

    letter-spacing: 2px;
}

.room-info {
    margin-top: 6px;

    font-size: 11px;
    color: #777;
}

/*
=========================================================
SCREENS
=========================================================
*/

.room-screen {
    display: none;
}

.room-screen.active {
    display: block;
}

.lobby.hidden {
    display: none;
}

/*
=========================================================
ROOM CODE
=========================================================
*/

.big-code {
    text-align: center;

    font-size: 30px;
    font-weight: 900;

    letter-spacing: 5px;

    margin: 7px 0 14px;
}

.center {
    text-align: center;
}

/*
=========================================================
TRUMP
=========================================================
*/

.trump {
    text-align: center;

    margin: 12px 0;

    padding: 11px;

    border-radius: 13px;

    background: #171717;

    border: 1px solid #2e2e2e;
}

.trump-label {
    color: #777;
    font-size: 10px;
}

.trump-value {
    margin-top: 4px;

    font-size: 27px;
    font-weight: 900;
}

.trump-value.red {
    color: #ff4d4d;
}

/*
=========================================================
OPPONENT
=========================================================
*/

.opponent {
    display: flex;

    justify-content: space-between;
    align-items: center;

    padding: 11px;

    border-radius: 13px;

    background: #0b0b0b;

    border: 1px solid #292929;
}

.opponent-name {
    font-weight: 800;
}

.opponent-count {
    color: #777;
    font-size: 12px;
}

/*
=========================================================
TURN
=========================================================
*/

.turn {
    margin: 12px 0;

    padding: 18px;

    text-align: center;

    border-radius: 15px;

    background: #0b0b0b;

    border: 1px solid #292929;
}

.turn.your {
    border-color: #666;
}

.turn.attack {
    border-color: #888;
}

.turn.defense {
    border-color: #555;
}

.turn-title {
    font-size: 23px;
    font-weight: 900;
}

.turn-description {
    margin-top: 5px;

    color: #777;

    font-size: 11px;
}

/*
=========================================================
TABLE
=========================================================
*/

.table {
    min-height: 110px;

    padding: 12px;

    border-radius: 16px;

    background:
        radial-gradient(
            circle at center,
            #151515 0%,
            #080808 75%
        );

    border: 1px solid #242424;
}

.table-empty {
    min-height: 80px;

    display: flex;

    justify-content: center;
    align-items: center;

    color: #555;

    font-size: 12px;
}

.pair {
    display: flex;

    justify-content: center;

    align-items: center;

    gap: 12px;

    margin-bottom: 12px;
}

.arrow {
    color: #666;

    font-size: 20px;
}

/*
=========================================================
CARDS
=========================================================
*/

.hand {
    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 8px;

    margin-top: 12px;
}

.card-item {
    width: 58px;
    height: 82px;

    flex: 0 0 58px;

    border-radius: 11px;

    background: #f5f5f5;

    color: #111;

    border: 2px solid #fff;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    font-weight: 900;

    box-shadow:
        0 5px 12px
        rgba(0,0,0,.35);

    user-select: none;

    transition:
        transform .12s ease,
        opacity .12s ease;
}

.card-item.clickable {
    cursor: pointer;
}

.card-item.clickable:active {
    transform:
        translateY(-5px)
        scale(.97);
}

.card-item.red {
    color: #d51e1e;
}

.card-rank {
    font-size: 22px;
    line-height: 1;
}

.card-suit {
    margin-top: 4px;

    font-size: 21px;
    line-height: 1;
}

/*
=========================================================
TABLE CARD
=========================================================
*/

.table-card {
    width: 58px;
    height: 82px;

    border-radius: 11px;

    background: #f5f5f5;

    color: #111;

    border: 2px solid #fff;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    font-weight: 900;

    box-shadow:
        0 5px 12px
        rgba(0,0,0,.4);
}

.table-card.red {
    color: #d51e1e;
}

/*
=========================================================
ACTIONS
=========================================================
*/

.actions {
    margin-top: 12px;
}

.action-row {
    display: flex;
    gap: 8px;
}

.action-row .btn {
    flex: 1;
}

/*
=========================================================
RESULT
=========================================================
*/

.result {
    display: none;

    padding: 20px;

    text-align: center;

    border-radius: 16px;

    background: #171717;

    border: 1px solid #333;

    margin-bottom: 12px;
}

.result.active {
    display: block;
}

.result-title {
    font-size: 28px;
    font-weight: 900;
}

.result-description {
    margin-top: 7px;

    color: #888;
}

/*
=========================================================
MOVES
=========================================================
*/

.moves {
    margin-top: 14px;
}

.move {
    padding: 7px 0;

    border-bottom: 1px solid #222;

    color: #777;

    font-size: 11px;
}

/*
=========================================================
WAITING
=========================================================
*/

.waiting {
    padding: 18px 0;

    text-align: center;

    color: #777;
}

/*
=========================================================
TOAST
=========================================================
*/

.toast {
    position: fixed;

    left: 14px;
    right: 14px;

    bottom:
        calc(
            17px +
            env(safe-area-inset-bottom)
        );

    padding: 13px;

    border-radius: 13px;

    background: #fff;
    color: #000;

    font-size: 13px;
    font-weight: 800;

    text-align: center;

    display: none;

    z-index: 1000;
}

.toast.show {
    display: block;
}

</style>

</head>

<body>

<div class="app">

<div class="header">

    <div class="logo">
        HEAVY LUX CARD
    </div>

    <div
        id="connection"
        class="connection"
    >
        Подключение...
    </div>

</div>


<!-- =====================================================
     LOBBY
====================================================== -->

<div
    id="lobby"
    class="lobby"
>

    <div class="card">

        <div class="title">
            Профиль
        </div>

        <div
            id="profileName"
            class="profile-name"
        >
            Загрузка...
        </div>

        <div
            id="profileId"
            class="profile-id"
        >
            —
        </div>

    </div>


    <div class="card">

        <div class="title">
            Дурак 1×1
        </div>

        <button
            id="createBtn"
            class="btn"
        >
            Создать комнату
        </button>

    </div>


    <div class="card">

        <div class="title">
            Войти по коду
        </div>

        <div class="join">

            <input
                id="roomInput"
                maxlength="6"
                placeholder="КОД"
                autocomplete="off"
            >

            <button
                id="joinBtn"
                class="btn"
            >
                Войти
            </button>

        </div>

    </div>


    <div class="card">

        <div class="title">
            Комнаты
        </div>

        <div id="rooms">
            <div class="waiting">
                Загрузка...
            </div>
        </div>

    </div>

</div>


<!-- =====================================================
     ROOM
====================================================== -->

<div
    id="roomScreen"
    class="room-screen"
>

    <div class="card">

        <div class="title">
            Дурак 1×1
        </div>

        <div
            id="bigCode"
            class="big-code"
        >
            ------
        </div>


        <div
            id="roomStatus"
            class="center"
        >
            Ожидание игрока...
        </div>


        <!-- КОЗЫРЬ -->

        <div
            id="trump"
            class="trump"
            style="display:none;"
        >

            <div class="trump-label">
                КОЗЫРЬ
            </div>

            <div
                id="trumpValue"
                class="trump-value"
            >
                —
            </div>

        </div>


        <!-- ПРОТИВНИК -->

        <div
            id="opponent"
            class="opponent"
            style="display:none;"
        >

            <div
                id="opponentName"
                class="opponent-name"
            >
                Противник
            </div>

            <div
                id="opponentCount"
                class="opponent-count"
            >
                6 карт
            </div>

        </div>


        <!-- ХОД -->

        <div
            id="turn"
            class="turn"
        >

            <div
                id="turnTitle"
                class="turn-title"
            >
                ОЖИДАНИЕ
            </div>

            <div
                id="turnDescription"
                class="turn-description"
            >
                Ожидаем второго игрока
            </div>

        </div>


        <!-- РЕЗУЛЬТАТ -->

        <div
            id="result"
            class="result"
        >

            <div
                id="resultTitle"
                class="result-title"
            >
                —
            </div>

            <div
                id="resultDescription"
                class="result-description"
            >
                —
            </div>

        </div>


        <!-- СТОЛ -->

        <div class="title">
            Стол
        </div>

        <div
            id="table"
            class="table"
        >

            <div class="table-empty">
                Пока нет карт
            </div>

        </div>


        <!-- ДЕЙСТВИЯ -->

        <div
            id="actions"
            class="actions"
        >

            <div
                id="actionRow"
                class="action-row"
            >

                <button
                    id="takeBtn"
                    class="btn take"
                    style="display:none;"
                >
                    ВЗЯТЬ
                </button>

                <button
                    id="beatBtn"
                    class="btn beat"
                    style="display:none;"
                >
                    БИТО
                </button>

            </div>

        </div>


        <!-- МОИ КАРТЫ -->

        <div class="title"
             style="margin-top:16px;">

            Мои карты

        </div>

        <div
            id="hand"
            class="hand"
        >
        </div>


        <div
            id="deckInfo"
            class="center"
            style="
                margin-top:12px;
                color:#666;
                font-size:11px;
            "
        >
            Колода: —
        </div>


        <!-- ИСТОРИЯ -->

        <div class="title"
             style="margin-top:17px;">

            История

        </div>

        <div
            id="moves"
            class="moves"
        >
        </div>


        <button
            id="leaveBtn"
            class="btn danger"
        >
            Покинуть комнату
        </button>

    </div>

</div>

</div>


<div
    id="toast"
    class="toast"
></div>


<script>

/*
=========================================================
TELEGRAM
=========================================================
*/

const telegram =
    window.Telegram?.WebApp || null;

if (telegram) {

    telegram.ready();
    telegram.expand();
}


/*
=========================================================
STATE
=========================================================
*/

let socket = null;

let profile = null;

let currentGame = null;


/*
=========================================================
DOM
=========================================================
*/

const lobby =
    document.getElementById(
        "lobby"
    );

const roomScreen =
    document.getElementById(
        "roomScreen"
    );

const connection =
    document.getElementById(
        "connection"
    );

const profileName =
    document.getElementById(
        "profileName"
    );

const profileId =
    document.getElementById(
        "profileId"
    );

const rooms =
    document.getElementById(
        "rooms"
    );

const bigCode =
    document.getElementById(
        "bigCode"
    );

const roomStatus =
    document.getElementById(
        "roomStatus"
    );

const trump =
    document.getElementById(
        "trump"
    );

const trumpValue =
    document.getElementById(
        "trumpValue"
    );

const opponent =
    document.getElementById(
        "opponent"
    );

const opponentName =
    document.getElementById(
        "opponentName"
    );

const opponentCount =
    document.getElementById(
        "opponentCount"
    );

const turn =
    document.getElementById(
        "turn"
    );

const turnTitle =
    document.getElementById(
        "turnTitle"
    );

const turnDescription =
    document.getElementById(
        "turnDescription"
    );

const result =
    document.getElementById(
        "result"
    );

const resultTitle =
    document.getElementById(
        "resultTitle"
    );

const resultDescription =
    document.getElementById(
        "resultDescription"
    );

const table =
    document.getElementById(
        "table"
    );

const hand =
    document.getElementById(
        "hand"
    );

const deckInfo =
    document.getElementById(
        "deckInfo"
    );

const moves =
    document.getElementById(
        "moves"
    );

const takeBtn =
    document.getElementById(
        "takeBtn"
    );

const beatBtn =
    document.getElementById(
        "beatBtn"
    );


/*
=========================================================
TOAST
=========================================================
*/

let toastTimer = null;

function showToast(text) {

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        text;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            3000
        );
}


/*
=========================================================
AUTH
=========================================================
*/

function socketAuth() {

    const auth = {};

    /*
    Telegram
    */

    if (
        telegram &&
        telegram.initData
    ) {

        auth.initData =
            telegram.initData;

    } else {

        /*
        TEST MODE.

        Один браузер =
        один тестовый игрок.

        Для второго игрока
        открывай второй браузер
        или приватное окно.
        */

        let id =
            localStorage.getItem(
                "hlc_test_id"
            );

        if (!id) {

            id =
                "test_" +
                Math.random()
                    .toString(36)
                    .slice(2, 10);

            localStorage.setItem(
                "hlc_test_id",
                id
            );
        }

        auth.testPlayerId =
            id;
    }

    return auth;
}


/*
=========================================================
CONNECT
=========================================================
*/

function connect() {

    socket =
        io(
            window.location.origin,
            {

                auth:
                    socketAuth(),

                transports: [
                    "websocket",
                    "polling"
                ],

                reconnection: true,

                reconnectionAttempts:
                    Infinity,

                reconnectionDelay:
                    1000,

                reconnectionDelayMax:
                    5000,

                timeout:
                    10000
            }
        );


    socket.on(
        "connect",
        () => {

            connection.textContent =
                "Онлайн";

            connection.classList.add(
                "online"
            );

            socket.emit(
                "get_profile"
            );

            socket.emit(
                "get_rooms"
            );
        }
    );


    socket.on(
        "disconnect",
        () => {

            connection.textContent =
                "Переподключение...";

            connection.classList.remove(
                "online"
            );
        }
    );


    socket.on(
        "connect_error",
        (error) => {

            console.error(
                "Socket error:",
                error
            );

            connection.textContent =
                "Ошибка подключения";

            connection.classList.remove(
                "online"
            );
        }
    );


    /*
    PROFILE
    */

    socket.on(
        "profile",
        (data) => {

            profile =
                data;

            profileName.textContent =
                data.name ||
                "Игрок";

            profileId.textContent =
                "ID: " +
                data.playerId;
        }
    );


    /*
    ROOMS
    */

    socket.on(
        "rooms_list",
        (list) => {

            renderRooms(
                list
            );
        }
    );


    /*
    CREATED
    */

    socket.on(
        "room_created",
        (room) => {

            openRoom();

            bigCode.textContent =
                room.id;

            showToast(
                "Комната создана"
            );
        }
    );


    /*
    GAME STATE
    */

    socket.on(
        "game_state",
        (state) => {

            currentGame =
                state;

            openRoom();

            renderGame(
                state
            );
        }
    );


    /*
    ERRORS
    */

    socket.on(
        "error_message",
        (message) => {

            showToast(
                message
            );
        }
    );


    socket.on(
        "game_error",
        (message) => {

            showToast(
                message
            );
        }
    );


    /*
    LEFT
    */

    socket.on(
        "left_room",
        () => {

            currentGame =
                null;

            closeRoom();

            socket.emit(
                "get_rooms"
            );
        }
    );
}


/*
=========================================================
ROOM LIST
=========================================================
*/

function renderRooms(list) {

    if (!Array.isArray(list)) {
        list = [];
    }

    if (!list.length) {

        rooms.innerHTML =
            `
            <div class="waiting">
                Нет доступных комнат
            </div>
            `;

        return;
    }

    rooms.innerHTML = "";

    list.forEach(
        (room) => {

            const full =
                room.playersCount >= 2;

            const playing =
                room.status ===
                "playing";

            const element =
                document.createElement(
                    "div"
                );

            element.className =
                "room";

            element.innerHTML =
                `
                <div class="room-head">

                    <div class="room-code">
                        ${escapeHtml(room.id)}
                    </div>

                    <div>
                        ${room.playersCount}/2
                    </div>

                </div>

                <div class="room-info">

                    ${
                        playing
                            ? "Игра идёт"
                            : "Ожидание игрока"
                    }

                </div>

                <button
                    class="btn secondary"
                    ${
                        full || playing
                            ? "disabled"
                            : ""
                    }
                >
                    Войти
                </button>
                `;

            const button =
                element.querySelector(
                    "button"
                );

            if (
                !full &&
                !playing
            ) {

                button.onclick =
                    () => {

                        socket.emit(
                            "join_room",
                            room.id
                        );
                    };
            }

            rooms.appendChild(
                element
            );
        }
    );
}


/*
=========================================================
OPEN / CLOSE
=========================================================
*/

function openRoom() {

    lobby.classList.add(
        "hidden"
    );

    roomScreen.classList.add(
        "active"
    );
}

function closeRoom() {

    roomScreen.classList.remove(
        "active"
    );

    lobby.classList.remove(
        "hidden"
    );
}


/*
=========================================================
GAME RENDER
=========================================================
*/

function renderGame(state) {

    bigCode.textContent =
        state.roomId || "------";

    deckInfo.textContent =
        "Колода: " +
        state.deckCount;


    /*
    STATUS
    */

    if (
        state.status ===
        "waiting"
    ) {

        roomStatus.textContent =
            "Ожидание второго игрока...";

    } else if (
        state.status ===
        "playing"
    ) {

        roomStatus.textContent =
            "Игра идёт";

    } else {

        roomStatus.textContent =
            "Игра завершена";
    }


    /*
    TRUMP
    */

    if (
        state.trumpSuit
    ) {

        trump.style.display =
            "block";

        trumpValue.textContent =
            state.trumpSuit;

        trumpValue.classList.toggle(
            "red",
            isRed(
                state.trumpSuit
            )
        );

    } else {

        trump.style.display =
            "none";
    }


    /*
    OPPONENT
    */

    if (
        state.opponent
    ) {

        opponent.style.display =
            "flex";

        opponentName.textContent =
            state.opponent.name;

        opponentCount.textContent =
            state.opponent.cardsCount +
            " карт";

    } else {

        opponent.style.display =
            "none";
    }


    /*
    TURN
    */

    turn.classList.remove(
        "your",
        "attack",
        "defense"
    );


    if (
        state.status ===
        "waiting"
    ) {

        turnTitle.textContent =
            "ОЖИДАНИЕ";

        turnDescription.textContent =
            "Ожидаем второго игрока";

    } else if (
        state.status ===
        "finished"
    ) {

        turnTitle.textContent =
            "ИГРА ЗАВЕРШЕНА";

        turnDescription.textContent =
            "Партия закончена";

    } else if (
        state.phase ===
        "attack"
    ) {

        if (
            state.canAttack
        ) {

            turn.classList.add(
                "your",
                "attack"
            );

            turnTitle.textContent =
                "ВАШ ХОД";

            if (
                state.table.length === 0
            ) {

                turnDescription.textContent =
                    "Выберите карту для атаки";

            } else {

                turnDescription.textContent =
                    "Выберите карту для подкидывания";
            }

        } else {

            turnTitle.textContent =
                "ХОД ПРОТИВНИКА";

            turnDescription.textContent =
                "Ожидайте атаки";
        }

    } else if (
        state.phase ===
        "defense"
    ) {

        if (
            state.canDefend
        ) {

            turn.classList.add(
                "your",
                "defense"
            );

            const allDefended =
                state.table.length > 0 &&
                state.table.every(
                    (pair) =>
                        !!pair.defense
                );

            if (allDefended) {

                turnTitle.textContent =
                    "ВСЁ ОТБИТО";

                turnDescription.textContent =
                    "Нажмите «БИТО»";

            } else {

                turnTitle.textContent =
                    "ЗАЩИЩАЙТЕСЬ";

                turnDescription.textContent =
                    "Выберите карту, чтобы отбиться, или нажмите «ВЗЯТЬ»";
            }

        } else {

            turnTitle.textContent =
                "ХОД ПРОТИВНИКА";

            turnDescription.textContent =
                "Противник защищается";
        }
    }


    /*
    RESULT
    */

    if (
        state.status ===
        "finished"
    ) {

        result.classList.add(
            "active"
        );

        if (
            state.winnerId ===
            state.me?.playerId
        ) {

            resultTitle.textContent =
                "ПОБЕДА";

            resultDescription.textContent =
                "Вы выиграли партию.";

        } else if (
            state.winnerId
        ) {

            resultTitle.textContent =
                "ПОРАЖЕНИЕ";

            resultDescription.textContent =
                "Вы проиграли партию.";

        } else {

            resultTitle.textContent =
                "ИГРА ЗАВЕРШЕНА";

            resultDescription.textContent =
                "";
        }

    } else {

        result.classList.remove(
            "active"
        );
    }


    /*
    TABLE
    */

    renderTable(
        state
    );


    /*
    HAND
    */

    renderHand(
        state
    );


    /*
    MOVES
    */

    renderMoves(
        state
    );


    /*
    ACTION BUTTONS
    */

    renderActions(
        state
    );
}


/*
=========================================================
ACTIONS
=========================================================
*/

function renderActions(state) {

    /*
    По умолчанию
    всё скрываем.
    */

    takeBtn.style.display =
        "none";

    beatBtn.style.display =
        "none";


    if (
        state.status !==
        "playing"
    ) {

        return;
    }


    if (
        state.phase !==
        "defense"
    ) {

        return;
    }


    if (
        !state.canDefend
    ) {

        return;
    }


    const hasUnbeaten =
        state.table.some(
            (pair) =>
                !pair.defense
        );

    const allDefended =
        state.table.length > 0 &&
        state.table.every(
            (pair) =>
                !!pair.defense
        );


    /*
    ВЗЯТЬ
    */

    if (hasUnbeaten) {

        takeBtn.style.display =
            "block";
    }


    /*
    БИТО
    */

    if (allDefended) {

        beatBtn.style.display =
            "block";
    }
}


/*
=========================================================
TABLE
=========================================================
*/

function renderTable(state) {

    table.innerHTML = "";

    if (
        !state.table ||
        !state.table.length
    ) {

        table.innerHTML =
            `
            <div class="table-empty">
                ${
                    state.status === "playing"
                        ? (
                            state.phase === "attack"
                                ? "Ожидание атаки"
                                : "Карты отсутствуют"
                        )
                        : "Стол пуст"
                }
            </div>
            `;

        return;
    }


    state.table.forEach(
        (pair) => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "pair";


            /*
            ATTACK CARD
            */

            row.appendChild(
                createCardElement(
                    pair.attack,
                    true
                )
            );


            /*
            ARROW
            */

            const arrow =
                document.createElement(
                    "div"
                );

            arrow.className =
                "arrow";

            arrow.textContent =
                pair.defense
                    ? "→"
                    : "×";

            row.appendChild(
                arrow
            );


            /*
            DEFENSE CARD
            */

            if (
                pair.defense
            ) {

                row.appendChild(
                    createTableCard(
                        pair.defense
                    )
                );

            } else {

                const empty =
                    document.createElement(
                        "div"
                    );

                empty.style.width =
                    "58px";

                empty.style.height =
                    "82px";

                empty.style.border =
                    "2px dashed #333";

                empty.style.borderRadius =
                    "11px";

                row.appendChild(
                    empty
                );
            }


            table.appendChild(
                row
            );
        }
    );
}


/*
=========================================================
HAND
=========================================================
*/

function renderHand(state) {

    hand.innerHTML = "";

    if (
        !Array.isArray(
            state.hand
        )
    ) {

        return;
    }


    state.hand.forEach(
        (card) => {

            const element =
                createCardElement(
                    card,
                    false
                );


            const clickable =
                (
                    state.status ===
                    "playing"
                ) &&
                (
                    state.canAttack ||
                    state.canDefend
                );


            if (clickable) {

                element.classList.add(
                    "clickable"
                );

                element.onclick =
                    () => {

                        handleCardClick(
                            card
                        );
                    };
            }


            hand.appendChild(
                element
            );
        }
    );
}


/*
=========================================================
CREATE HAND CARD
=========================================================
*/

function createCardElement(
    card,
    tableCard
) {

    const element =
        document.createElement(
            "div"
        );

    element.className =
        tableCard
            ? "table-card"
            : "card-item";


    if (
        isRed(
            card.suit
        )
    ) {

        element.classList.add(
            "red"
        );
    }


    element.innerHTML =
        `
        <div class="card-rank">
            ${escapeHtml(card.rank)}
        </div>

        <div class="card-suit">
            ${escapeHtml(card.suit)}
        </div>
        `;

    return element;
}


/*
=========================================================
CREATE TABLE CARD
=========================================================
*/

function createTableCard(card) {

    return createCardElement(
        card,
        true
    );
}


/*
=========================================================
CARD CLICK
=========================================================
*/

function handleCardClick(card) {

    if (!currentGame) {
        return;
    }

    if (
        currentGame.status !==
        "playing"
    ) {
        return;
    }


    /*
    АТАКА / ПОДКИДЫВАНИЕ
    */

    if (
        currentGame.phase ===
        "attack" &&
        currentGame.canAttack
    ) {

        socket.emit(
            "attack_card",
            card.id
        );

        return;
    }


    /*
    ЗАЩИТА
    */

    if (
        currentGame.phase ===
        "defense" &&
        currentGame.canDefend
    ) {

        const target =
            currentGame.table.find(
                (pair) =>
                    !pair.defense
            );

        if (!target) {

            /*
            Если всё отбито —
            карта уже не нужна.
            */

            return;
        }

        socket.emit(
            "defend_card",
            {

                attackId:
                    target.attack.id,

                defenseId:
                    card.id
            }
        );
    }
}


/*
=========================================================
TAKE
=========================================================
*/

takeBtn.onclick =
    () => {

        if (!socket) {
            return;
        }

        socket.emit(
            "take_cards"
        );
    };


/*
=========================================================
BEAT
=========================================================
*/

beatBtn.onclick =
    () => {

        if (!socket) {
            return;
        }

        socket.emit(
            "beat"
        );
    };


/*
=========================================================
CREATE ROOM
=========================================================
*/

document
    .getElementById(
        "createBtn"
    )
    .onclick =
    () => {

        if (
            !socket ||
            !socket.connected
        ) {

            showToast(
                "Socket.IO не подключён"
            );

            return;
        }

        socket.emit(
            "create_room"
        );
    };


/*
=========================================================
JOIN ROOM
=========================================================
*/

document
    .getElementById(
        "joinBtn"
    )
    .onclick =
    () => {

        const input =
            document.getElementById(
                "roomInput"
            );

        const code =
            input.value
                .trim()
                .toUpperCase();

        if (!code) {

            showToast(
                "Введите код комнаты"
            );

            return;
        }

        socket.emit(
            "join_room",
            code
        );
    };


document
    .getElementById(
        "roomInput"
    )
    .addEventListener(
        "keydown",
        (event) => {

            if (
                event.key ===
                "Enter"
            ) {

                document
                    .getElementById(
                        "joinBtn"
                    )
                    .click();
            }
        }
    );


/*
=========================================================
LEAVE
=========================================================
*/

document
    .getElementById(
        "leaveBtn"
    )
    .onclick =
    () => {

        if (
            socket &&
            socket.connected
        ) {

            socket.emit(
                "leave_room"
            );
        }
    };


/*
=========================================================
MOVES
=========================================================
*/

function renderMoves(state) {

    moves.innerHTML = "";

    if (
        !state.moves ||
        !state.moves.length
    ) {

        moves.innerHTML =
            `
            <div class="waiting">
                Ходов пока нет
            </div>
            `;

        return;
    }


    const lastMoves =
        state.moves.slice(-15);


    lastMoves.forEach(
        (move) => {

            const element =
                document.createElement(
                    "div"
                );

            element.className =
                "move";


            let text =
                "Действие";


            if (
                move.type ===
                "start"
            ) {

                text =
                    "Игра началась";

            } else if (
                move.type ===
                "attack"
            ) {

                text =
                    "Атака: " +
                    move.card;

            } else if (
                move.type ===
                "defend"
            ) {

                text =
                    "Защита: " +
                    move.card;

            } else if (
                move.type ===
                "take"
            ) {

                text =
                    "Игрок взял карты";

            } else if (
                move.type ===
                "beat"
            ) {

                text =
                    "БИТО";

            }


            element.textContent =
                text;

            moves.appendChild(
                element
            );
        }
    );
}


/*
=========================================================
HELPERS
=========================================================
*/

function isRed(suit) {

    return (
        suit === "♥" ||
        suit === "♦"
    );
}


function escapeHtml(value) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


/*
=========================================================
START
=========================================================
*/

connect();

</script>

</body>

</html>
