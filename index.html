<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no,
             viewport-fit=cover"
>

<title>Heavy Lux Card</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script src="/socket.io/socket.io.js"></script>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    min-height: 100%;

    background: #070707;
    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

body {
    min-height: 100vh;
}

button,
input {
    font: inherit;
}

button {
    border: 0;
}

.app {
    width: 100%;
    max-width: 620px;

    min-height: 100vh;

    margin: auto;

    padding:
        calc(16px + env(safe-area-inset-top))
        14px
        calc(24px + env(safe-area-inset-bottom));
}

/*
=========================================================
HEADER
=========================================================
*/

.header {
    display: flex;

    justify-content: space-between;
    align-items: center;

    margin-bottom: 15px;
}

.logo {
    font-size: 19px;
    font-weight: 950;
    letter-spacing: 1px;
}

.connection {
    font-size: 11px;
    color: #777;
}

.connection.online {
    color: #5cff91;
}

/*
=========================================================
CARD
=========================================================
*/

.card {
    background: #111;

    border: 1px solid #252525;

    border-radius: 18px;

    padding: 17px;

    margin-bottom: 13px;
}

.title {
    font-size: 17px;
    font-weight: 900;

    margin-bottom: 13px;
}

/*
=========================================================
BUTTONS
=========================================================
*/

.btn {
    width: 100%;

    padding: 14px;

    margin-top: 9px;

    border-radius: 13px;

    background: #fff;
    color: #000;

    font-size: 14px;
    font-weight: 900;
}

.btn.secondary {
    background: #1c1c1c;
    color: #fff;

    border: 1px solid #333;
}

.btn.danger {
    background: #291010;
    color: #ff6767;

    border: 1px solid #481b1b;
}

.btn.green {
    background: #19321f;
    color: #72ff9b;

    border: 1px solid #2b6039;
}

.btn:disabled {
    opacity: .3;
}

.btn:active {
    transform: scale(.98);
}

/*
=========================================================
PROFILE
=========================================================
*/

.profile-name {
    font-size: 22px;
    font-weight: 900;
}

.profile-id {
    margin-top: 5px;

    color: #666;

    font-size: 10px;
}

/*
=========================================================
JOIN
=========================================================
*/

.join {
    display: flex;
    gap: 8px;
}

.join input {
    flex: 1;

    min-width: 0;

    padding: 13px;

    border-radius: 12px;

    border: 1px solid #333;

    background: #080808;
    color: #fff;

    outline: none;

    text-transform: uppercase;
}

.join .btn {
    width: 100px;
    margin-top: 0;
}

/*
=========================================================
ROOMS
=========================================================
*/

.room {
    padding: 14px;

    margin-top: 9px;

    border-radius: 14px;

    background: #0b0b0b;

    border: 1px solid #292929;
}

.room-head {
    display: flex;

    justify-content: space-between;
}

.room-code {
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 2px;
}

.room-info {
    margin-top: 5px;

    color: #777;

    font-size: 11px;
}

/*
=========================================================
SCREENS
=========================================================
*/

.room-screen {
    display: none;
}

.room-screen.active {
    display: block;
}

.lobby.hidden {
    display: none;
}

/*
=========================================================
GAME HEADER
=========================================================
*/

.big-code {
    text-align: center;

    font-size: 27px;
    font-weight: 950;

    letter-spacing: 5px;

    margin: 5px 0 12px;
}

.game-status {
    text-align: center;

    color: #888;

    font-size: 12px;
}

/*
=========================================================
TRUMP
=========================================================
*/

.trump {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 10px;

    margin: 15px 0;
}

.trump-label {
    color: #777;

    font-size: 11px;
}

.trump-suit {
    font-size: 30px;
    font-weight: 900;
}

/*
=========================================================
OPPONENT
=========================================================
*/

.opponent-box {
    display: flex;

    justify-content: space-between;
    align-items: center;

    padding: 12px;

    border-radius: 14px;

    background: #0b0b0b;

    border: 1px solid #292929;
}

.opponent-name {
    font-weight: 900;
}

.card-count {
    color: #888;
    font-size: 12px;
}

/*
=========================================================
TURN
=========================================================
*/

.turn {
    margin: 13px 0;

    padding: 15px;

    border-radius: 15px;

    text-align: center;

    background: #0b0b0b;

    border: 1px solid #292929;
}

.turn.your {
    border-color: #5cff91;
}

.turn-title {
    font-size: 20px;
    font-weight: 950;
}

.turn-description {
    margin-top: 4px;

    color: #777;

    font-size: 11px;
}

/*
=========================================================
TABLE
=========================================================
*/

.table-area {
    min-height: 160px;

    margin: 13px 0;

    padding: 12px;

    border-radius: 17px;

    background:
        radial-gradient(
            circle at center,
            #171717,
            #0a0a0a
        );

    border: 1px solid #252525;
}

.table-title {
    text-align: center;

    color: #666;

    font-size: 10px;

    margin-bottom: 8px;

    text-transform: uppercase;
}

.table-cards {
    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 9px;
}

.table-pair {
    position: relative;

    width: 66px;

    height: 90px;
}

.table-pair .attack-card {
    position: absolute;

    top: 0;
    left: 0;
}

.table-pair .defense-card {
    position: absolute;

    top: 13px;
    left: 12px;
}

/*
=========================================================
CARDS
=========================================================
*/

.hand-title {
    color: #777;

    font-size: 10px;

    text-transform: uppercase;

    margin-bottom: 8px;
}

.hand {
    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 7px;
}

.card-game {
    position: relative;

    width: 58px;
    height: 78px;

    border-radius: 10px;

    background: #f5f5f5;
    color: #111;

    border: 2px solid #fff;

    box-shadow:
        0 4px 12px rgba(0,0,0,.35);

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    font-weight: 950;

    cursor: pointer;

    user-select: none;
}

.card-game.red {
    color: #d71919;
}

.card-game.black {
    color: #111;
}

.card-game .rank {
    font-size: 19px;
}

.card-game .suit {
    font-size: 21px;
}

.card-game.selected {
    transform: translateY(-8px);

    border-color: #5cff91;

    box-shadow:
        0 0 0 2px #5cff91;
}

.card-game.disabled {
    opacity: .45;
}

/*
=========================================================
ACTIONS
=========================================================
*/

.actions {
    margin-top: 12px;
}

.action-row {
    display: flex;
    gap: 8px;
}

.action-row .btn {
    flex: 1;
}

/*
=========================================================
RESULT
=========================================================
*/

.result {
    padding: 22px 12px;

    text-align: center;

    border-radius: 16px;

    background: #171717;

    border: 1px solid #444;

    margin-bottom: 12px;
}

.result-title {
    font-size: 27px;
    font-weight: 950;
}

.result-sub {
    margin-top: 6px;

    color: #888;

    font-size: 12px;
}

/*
=========================================================
WAITING
=========================================================
*/

.waiting {
    text-align: center;

    padding: 18px;

    color: #777;

    font-size: 12px;
}

/*
=========================================================
TOAST
=========================================================
*/

.toast {
    position: fixed;

    left: 14px;
    right: 14px;

    bottom:
        calc(
            17px +
            env(safe-area-inset-bottom)
        );

    z-index: 1000;

    display: none;

    padding: 13px;

    border-radius: 13px;

    background: #fff;
    color: #000;

    font-size: 13px;
    font-weight: 900;

    text-align: center;
}

.toast.show {
    display: block;
}

</style>

</head>

<body>

<div class="app">

<div class="header">

    <div class="logo">
        HEAVY LUX CARD
    </div>

    <div
        id="connection"
        class="connection"
    >
        Подключение...
    </div>

</div>


<!-- =====================================================
     LOBBY
====================================================== -->

<div
    id="lobby"
    class="lobby"
>

    <div class="card">

        <div class="title">
            Профиль
        </div>

        <div
            id="profileName"
            class="profile-name"
        >
            Загрузка...
        </div>

        <div
            id="profileId"
            class="profile-id"
        >
            —
        </div>

    </div>


    <div class="card">

        <div class="title">
            Дурак 1×1
        </div>

        <button
            id="createBtn"
            class="btn"
        >
            Создать комнату
        </button>

    </div>


    <div class="card">

        <div class="title">
            Войти по коду
        </div>

        <div class="join">

            <input
                id="roomInput"
                maxlength="6"
                placeholder="КОД"
                autocomplete="off"
            >

            <button
                id="joinBtn"
                class="btn"
            >
                Войти
            </button>

        </div>

    </div>


    <div class="card">

        <div class="title">
            Комнаты
        </div>

        <div id="rooms">
            <div class="waiting">
                Загрузка...
            </div>
        </div>

    </div>

</div>


<!-- =====================================================
     ROOM
====================================================== -->

<div
    id="roomScreen"
    class="room-screen"
>

    <div class="card">

        <div class="title">
            Дурак 1×1
        </div>

        <div
            id="bigCode"
            class="big-code"
        >
            ------
        </div>

        <div
            id="gameStatus"
            class="game-status"
        >
            Подготовка...
        </div>


        <div class="trump">

            <div class="trump-label">
                КОЗЫРЬ
            </div>

            <div
                id="trumpSuit"
                class="trump-suit"
            >
                —
            </div>

        </div>


        <div
            id="opponent"
            class="opponent-box"
        >

            <div
                id="opponentName"
                class="opponent-name"
            >
                Противник
            </div>

            <div
                id="opponentCards"
                class="card-count"
            >
                0 карт
            </div>

        </div>


        <div
            id="turn"
            class="turn"
        >

            <div
                id="turnTitle"
                class="turn-title"
            >
                ОЖИДАНИЕ
            </div>

            <div
                id="turnDescription"
                class="turn-description"
            >
                —
            </div>

        </div>


        <div class="table-area">

            <div class="table-title">
                Стол
            </div>

            <div
                id="tableCards"
                class="table-cards"
            >
            </div>

        </div>


        <div class="hand-title">
            Ваши карты
        </div>

        <div
            id="hand"
            class="hand"
        >
        </div>


        <div class="actions">

            <div class="action-row">

                <button
                    id="finishBtn"
                    class="btn green"
                    style="display:none;"
                >
                    Закончить атаку
                </button>

                <button
                    id="takeBtn"
                    class="btn danger"
                    style="display:none;"
                >
                    Взять карты
                </button>

            </div>

        </div>


        <div
            id="result"
            class="result"
            style="display:none;"
        >

            <div
                id="resultTitle"
                class="result-title"
            >
                —
            </div>

            <div
                id="resultSub"
                class="result-sub"
            >
                —
            </div>

        </div>


        <button
            id="leaveBtn"
            class="btn secondary"
        >
            Выйти в лобби
        </button>

    </div>

</div>

</div>


<div
    id="toast"
    class="toast"
></div>


<script>

/*
=========================================================
TELEGRAM
=========================================================
*/

const telegram =
    window.Telegram?.WebApp || null;

if (telegram) {
    telegram.ready();
    telegram.expand();
}


/*
=========================================================
VARIABLES
=========================================================
*/

let socket = null;
let profile = null;
let currentGame = null;


/*
=========================================================
DOM
=========================================================
*/

const lobby =
    document.getElementById("lobby");

const roomScreen =
    document.getElementById("roomScreen");

const connection =
    document.getElementById("connection");

const profileName =
    document.getElementById("profileName");

const profileId =
    document.getElementById("profileId");

const rooms =
    document.getElementById("rooms");

const bigCode =
    document.getElementById("bigCode");

const gameStatus =
    document.getElementById("gameStatus");

const trumpSuit =
    document.getElementById("trumpSuit");

const opponentName =
    document.getElementById("opponentName");

const opponentCards =
    document.getElementById("opponentCards");

const turn =
    document.getElementById("turn");

const turnTitle =
    document.getElementById("turnTitle");

const turnDescription =
    document.getElementById("turnDescription");

const tableCards =
    document.getElementById("tableCards");

const hand =
    document.getElementById("hand");

const finishBtn =
    document.getElementById("finishBtn");

const takeBtn =
    document.getElementById("takeBtn");

const result =
    document.getElementById("result");

const resultTitle =
    document.getElementById("resultTitle");

const resultSub =
    document.getElementById("resultSub");

const toast =
    document.getElementById("toast");


/*
=========================================================
TOAST
=========================================================
*/

let toastTimer = null;

function showToast(message) {

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            () => {
                toast.classList.remove(
                    "show"
                );
            },
            2800
        );
}


/*
=========================================================
AUTH
=========================================================
*/

function socketAuth() {

    const auth = {};

    if (
        telegram &&
        telegram.initData
    ) {

        auth.initData =
            telegram.initData;

    } else {

        let id =
            localStorage.getItem(
                "hlc_test_id"
            );

        if (!id) {

            id =
                "test_" +
                Math.random()
                    .toString(36)
                    .slice(2, 10);

            localStorage.setItem(
                "hlc_test_id",
                id
            );
        }

        auth.testPlayerId =
            id;
    }

    return auth;
}


/*
=========================================================
CONNECT
=========================================================
*/

function connect() {

    socket =
        io(
            window.location.origin,
            {
                auth:
                    socketAuth(),

                transports: [
                    "websocket",
                    "polling"
                ],

                reconnection: true,

                reconnectionAttempts:
                    Infinity,

                reconnectionDelay:
                    1000,

                reconnectionDelayMax:
                    5000,

                timeout:
                    10000
            }
        );


    socket.on(
        "connect",
        () => {

            connection.textContent =
                "Онлайн";

            connection.classList.add(
                "online"
            );

            socket.emit(
                "get_profile"
            );

            socket.emit(
                "get_rooms"
            );
        }
    );


    socket.on(
        "disconnect",
        () => {

            connection.textContent =
                "Переподключение...";

            connection.classList.remove(
                "online"
            );
        }
    );


    socket.on(
        "connect_error",
        error => {

            console.error(
                "Socket error:",
                error
            );

            connection.textContent =
                "Ошибка Socket.IO";

            connection.classList.remove(
                "online"
            );
        }
    );


    socket.on(
        "profile",
        data => {

            profile =
                data;

            profileName.textContent =
                data.name ||
                "Игрок";

            profileId.textContent =
                "ID: " +
                data.playerId;
        }
    );


    socket.on(
        "rooms_list",
        list => {

            renderRooms(
                list
            );
        }
    );


    socket.on(
        "room_created",
        room => {

            openRoom();

            bigCode.textContent =
                room.id;

            showToast(
                "Комната создана. Ждём противника."
            );
        }
    );


    socket.on(
        "game_state",
        state => {

            currentGame =
                state;

            openRoom();

            renderGame(
                state
            );
        }
    );


    socket.on(
        "error_message",
        message => {

            showToast(
                message
            );
        }
    );


    socket.on(
        "move_error",
        message => {

            showToast(
                message
            );
        }
    );


    socket.on(
        "left_room",
        () => {

            currentGame =
                null;

            closeRoom();

            socket.emit(
                "get_rooms"
            );
        }
    );
}


/*
=========================================================
ROOMS
=========================================================
*/

function renderRooms(list) {

    if (!list.length) {

        rooms.innerHTML =
            `
            <div class="waiting">
                Нет доступных комнат
            </div>
            `;

        return;
    }

    rooms.innerHTML = "";

    list.forEach(
        room => {

            const element =
                document.createElement(
                    "div"
                );

            element.className =
                "room";

            const full =
                room.playersCount >= 2;

            const playing =
                room.status ===
                "playing";

            element.innerHTML =
                `
                <div class="room-head">

                    <div class="room-code">
                        ${escapeHtml(room.id)}
                    </div>

                    <div>
                        ${room.playersCount}/2
                    </div>

                </div>

                <div class="room-info">
                    ${
                        playing
                            ? "Игра идёт"
                            : "Ожидание игрока"
                    }
                </div>

                <button
                    class="btn secondary"
                    ${
                        full || playing
                            ? "disabled"
                            : ""
                    }
                >
                    Войти
                </button>
                `;

            if (
                !full &&
                !playing
            ) {

                element
                    .querySelector("button")
                    .addEventListener(
                        "click",
                        () => {

                            socket.emit(
                                "join_room",
                                room.id
                            );
                        }
                    );
            }

            rooms.appendChild(
                element
            );
        }
    );
}


/*
=========================================================
OPEN/CLOSE
=========================================================
*/

function openRoom() {

    lobby.classList.add(
        "hidden"
    );

    roomScreen.classList.add(
        "active"
    );
}

function closeRoom() {

    roomScreen.classList.remove(
        "active"
    );

    lobby.classList.remove(
        "hidden"
    );
}


/*
=========================================================
CARD HTML
=========================================================
*/

function isRedSuit(suit) {

    return (
        suit === "♥" ||
        suit === "♦"
    );
}

function cardHTML(
    card,
    className = ""
) {

    const red =
        isRedSuit(
            card.suit
        );

    return `
        <div
            class="card-game
                   ${red ? "red" : "black"}
                   ${className}"
            data-card-id="${escapeHtml(card.id)}"
        >
            <div class="rank">
                ${escapeHtml(card.rank)}
            </div>

            <div class="suit">
                ${escapeHtml(card.suit)}
            </div>
        </div>
    `;
}


/*
=========================================================
RENDER GAME
=========================================================
*/

function renderGame(state) {

    bigCode.textContent =
        state.roomId;

    trumpSuit.textContent =
        state.trump;


    /*
    STATUS
    */

    if (
        state.status ===
        "finished"
    ) {

        gameStatus.textContent =
            "Игра окончена";

    } else if (
        state.status ===
        "draw"
    ) {

        gameStatus.textContent =
            "Ничья";

    } else {

        gameStatus.textContent =
            `Колода: ${state.deckCount} карт`;
    }


    /*
    OPPONENT
    */

    if (state.opponent) {

        opponentName.textContent =
            state.opponent.name;

        opponentCards.textContent =
            `${state.opponent.cards} карт`;

    } else {

        opponentName.textContent =
            "Противник";

        opponentCards.textContent =
            "—";
    }


    /*
    TURN
    */

    turn.classList.remove(
        "your"
    );

    if (
        state.status ===
        "finished"
    ) {

        turnTitle.textContent =
            "ИГРА ОКОНЧЕНА";

        turnDescription.textContent =
            "Раунд завершён";

    } else if (
        state.isAttacker
    ) {

        turn.classList.add(
            "your"
        );

        turnTitle.textContent =
            "ВАША АТАКА";

        turnDescription.textContent =
            "Вы можете положить карту или подкинуть карту";

    } else {

        turnTitle.textContent =
            "ЗАЩИТА";

        turnDescription.textContent =
            "Выберите карту и карту атаки, которую хотите побить";
    }


    /*
    TABLE
    */

    renderTable(
        state
    );


    /*
    HAND
    */

    renderHand(
        state
    );


    /*
    ACTIONS
    */

    finishBtn.style.display =
        "none";

    takeBtn.style.display =
        "none";

    if (
        state.status !==
        "finished"
    ) {

        /*
        Если атакующий и все карты
        побиты — можно закончить атаку.
        */

        if (
            state.isAttacker &&
            state.table.length > 0 &&
            state.table.every(
                pair =>
                    pair.defense
            )
        ) {

            finishBtn.style.display =
                "block";
        }

        /*
        Защитник может взять,
        если есть хотя бы одна
        непобитая карта.
        */

        if (
            state.isDefender &&
            state.phase ===
            "defense" &&
            state.table.some(
                pair =>
                    !pair.defense
            )
        ) {

            takeBtn.style.display =
                "block";
        }
    }


    /*
    RESULT
    */

    if (
        state.status ===
        "finished" ||
        state.status ===
        "draw"
    ) {

        result.style.display =
            "block";

        if (
            state.status ===
            "draw"
        ) {

            resultTitle.textContent =
                "НИЧЬЯ";

            resultSub.textContent =
                "Оба игрока закончили одновременно";

        } else if (
            state.winner ===
            state.me?.playerId
        ) {

            resultTitle.textContent =
                "ПОБЕДА";

            resultSub.textContent =
                "Вы вышли из игры первым.";

        } else {

            resultTitle.textContent =
                "ПОРАЖЕНИЕ";

            resultSub.textContent =
                "Победил противник.";
        }

    } else {

        result.style.display =
            "none";
    }
}


/*
=========================================================
TABLE
=========================================================
*/

function renderTable(state) {

    tableCards.innerHTML = "";

    if (
        !state.table.length
    ) {

        tableCards.innerHTML =
            `
            <div class="waiting">
                На столе пока нет карт
            </div>
            `;

        return;
    }

    state.table.forEach(
        pair => {

            const wrapper =
                document.createElement(
                    "div"
                );

            wrapper.className =
                "table-pair";

            wrapper.innerHTML =
                cardHTML(
                    pair.attack,
                    "attack-card"
                );

            if (
                pair.defense
            ) {

                wrapper.innerHTML +=
                    cardHTML(
                        pair.defense,
                        "defense-card"
                    );
            }

            tableCards.appendChild(
                wrapper
            );
        }
    );
}


/*
=========================================================
HAND
=========================================================
*/

function renderHand(state) {

    hand.innerHTML = "";

    state.hand.forEach(
        card => {

            const element =
                document.createElement(
                    "div"
                );

            element.innerHTML =
                cardHTML(
                    card
                );

            const cardElement =
                element.firstElementChild;

            /*
            АТАКА
            */

            cardElement.addEventListener(
                "click",
                () => {

                    handleCardClick(
                        card
                    );
                }
            );

            hand.appendChild(
                cardElement
            );
        }
    );
}


/*
=========================================================
CARD CLICK
=========================================================
*/

let selectedAttackCard = null;

function handleCardClick(card) {

    if (!currentGame) {
        return;
    }

    /*
    Атакующий.
    */

    if (
        currentGame.isAttacker
    ) {

        socket.emit(
            "attack_card",
            {
                cardId:
                    card.id
            }
        );

        return;
    }

    /*
    Защитник.

    Сначала выбираем карту
    из руки, затем атакующую карту
    на столе.
    */

    if (
        currentGame.isDefender &&
        currentGame.phase ===
        "defense"
    ) {

        const target =
            currentGame.table.find(
                pair =>
                    !pair.defense
            );

        if (!target) {
            return;
        }

        socket.emit(
            "defend_card",
            {
                cardId:
                    card.id,

                attackId:
                    target.attack.id
            }
        );
    }
}


/*
=========================================================
FINISH ATTACK
=========================================================
*/

finishBtn.addEventListener(
    "click",
    () => {

        socket.emit(
            "finish_attack"
        );
    }
);


/*
=========================================================
TAKE
=========================================================
*/

takeBtn.addEventListener(
    "click",
    () => {

        socket.emit(
            "take_cards"
        );
    }
);


/*
=========================================================
CREATE
=========================================================
*/

document
    .getElementById("createBtn")
    .addEventListener(
        "click",
        () => {

            if (
                !socket ||
                !socket.connected
            ) {

                showToast(
                    "Socket.IO не подключён"
                );

                return;
            }

            socket.emit(
                "create_room"
            );
        }
    );


/*
=========================================================
JOIN
=========================================================
*/

document
    .getElementById("joinBtn")
    .addEventListener(
        "click",
        () => {

            const input =
                document.getElementById(
                    "roomInput"
                );

            const code =
                input.value
                    .trim()
                    .toUpperCase();

            if (!code) {

                showToast(
                    "Введите код комнаты"
                );

                return;
            }

            socket.emit(
                "join_room",
                code
            );
        }
    );


document
    .getElementById("roomInput")
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {

                document
                    .getElementById(
                        "joinBtn"
                    )
                    .click();
            }
        }
    );


/*
=========================================================
LEAVE
=========================================================
*/

document
    .getElementById("leaveBtn")
    .addEventListener(
        "click",
        () => {

            if (
                socket &&
                socket.connected
            ) {

                socket.emit(
                    "leave_room"
                );
            }
        }
    );


/*
=========================================================
ESCAPE
=========================================================
*/

function escapeHtml(value) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


/*
=========================================================
START
=========================================================
*/

connect();

</script>
