<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no,
             viewport-fit=cover"
>

<title>Heavy Lux Card</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/socket.io/socket.io.js"></script>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    min-height: 100%;

    background: #070707;
    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

body {
    min-height: 100vh;
}

button,
input {
    font: inherit;
}

button {
    border: 0;
}

.app {
    width: 100%;
    max-width: 620px;

    min-height: 100vh;

    margin: auto;

    padding:
        calc(16px + env(safe-area-inset-top))
        14px
        calc(25px + env(safe-area-inset-bottom));
}

/* HEADER */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 15px;
}

.logo {
    font-size: 19px;
    font-weight: 900;
    letter-spacing: 1px;
}

.connection {
    font-size: 11px;
    color: #777;
}

.connection.online {
    color: #5cff91;
}

/* CARD */

.card {
    background: #111;

    border: 1px solid #242424;

    border-radius: 18px;

    padding: 16px;

    margin-bottom: 12px;
}

.title {
    font-size: 17px;
    font-weight: 900;

    margin-bottom: 13px;
}

/* BUTTON */

.btn {
    width: 100%;

    padding: 14px;

    margin-top: 9px;

    border-radius: 13px;

    background: #fff;
    color: #000;

    font-weight: 900;

    cursor: pointer;
}

.btn.secondary {
    background: #1d1d1d;
    color: #fff;

    border: 1px solid #303030;
}

.btn.danger {
    background: #2a1010;
    color: #ff6666;

    border: 1px solid #451818;
}

.btn.take {
    background: #341313;
    color: #ff7777;

    border: 1px solid #5b2020;
}

.btn.done {
    background: #151515;
    color: #fff;

    border: 1px solid #444;
}

.btn:disabled {
    opacity: .35;
}

/* PROFILE */

.profile-name {
    font-size: 23px;
    font-weight: 900;
}

.profile-id {
    margin-top: 4px;

    color: #666;
    font-size: 10px;
}

/* JOIN */

.join {
    display: flex;
    gap: 8px;
}

.join input {
    flex: 1;

    min-width: 0;

    padding: 13px;

    border-radius: 13px;

    border: 1px solid #303030;

    outline: none;

    background: #080808;
    color: #fff;

    text-transform: uppercase;
}

.join .btn {
    width: 100px;
    margin-top: 0;
}

/* ROOMS */

.room {
    padding: 13px;

    margin-top: 9px;

    border-radius: 13px;

    background: #0b0b0b;

    border: 1px solid #292929;
}

.room-head {
    display: flex;
    justify-content: space-between;
}

.room-code {
    font-size: 18px;
    font-weight: 900;

    letter-spacing: 2px;
}

.room-info {
    margin-top: 6px;

    font-size: 11px;
    color: #777;
}

/* SCREENS */

.room-screen {
    display: none;
}

.room-screen.active {
    display: block;
}

.lobby.hidden {
    display: none;
}

/* ROOM */

.big-code {
    text-align: center;

    font-size: 30px;
    font-weight: 900;

    letter-spacing: 5px;

    margin: 7px 0 14px;
}

.center {
    text-align: center;
}

/* TRUMP */

.trump {
    text-align: center;

    margin: 12px 0;

    padding: 11px;

    border-radius: 13px;

    background: #171717;

    border: 1px solid #2e2e2e;
}

.trump-label {
    color: #777;
    font-size: 10px;
}

.trump-value {
    margin-top: 4px;

    font-size: 25px;
    font-weight: 900;
}

/* OPPONENT */

.opponent {
    display: flex;

    justify-content: space-between;
    align-items: center;

    padding: 11px;

    border-radius: 13px;

    background: #0b0b0b;

    border: 1px solid #292929;
}

.opponent-name {
    font-weight: 800;
}

.opponent-count {
    color: #777;
    font-size: 12px;
}

/* TURN */

.turn {
    margin: 12px 0;

    padding: 18px;

    text-align: center;

    border-radius: 15px;

    background: #0b0b0b;

    border: 1px solid #292929;
}

.turn.your {
    border-color: #666;
}

.turn-title {
    font-size: 23px;
    font-weight: 900;
}

.turn-description {
    margin-top: 5px;

    color: #777;

    font-size: 11px;
}

/* TABLE */

.table {
    min-height: 100px;

    padding: 12px;

    border-radius: 16px;

    background: #080808;

    border: 1px solid #242424;
}

.table-empty {
    min-height: 80px;

    display: flex;

    justify-content: center;
    align-items: center;

    color: #555;

    font-size: 12px;
}

.pair {
    display: flex;

    justify-content: center;

    align-items: center;

    gap: 12px;

    margin-bottom: 12px;
}

.arrow {
    color: #555;
}

/* CARDS */

.hand {
    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 8px;

    margin-top: 12px;
}

.card-item {
    width: 57px;
    height: 78px;

    border-radius: 11px;

    background: #f5f5f5;

    color: #111;

    border: 2px solid #fff;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    font-weight: 900;

    box-shadow:
        0 4px 10px
        rgba(0,0,0,.3);

    cursor: pointer;

    user-select: none;

    transition:
        transform .12s ease,
        opacity .12s ease;
}

.card-item:active {
    transform: translateY(-5px);
}

.card-item.red {
    color: #d22;
}

.card-rank {
    font-size: 22px;
}

.card-suit {
    font-size: 20px;
}

/* ACTIONS */

.actions {
    margin-top: 10px;
}

.actions .btn {
    display: none;
}

.actions .btn.visible {
    display: block;
}

/* RESULT */

.result {
    display: none;

    padding: 20px;

    text-align: center;

    border-radius: 16px;

    background: #171717;

    border: 1px solid #333;

    margin-bottom: 12px;
}

.result.active {
    display: block;
}

.result-title {
    font-size: 28px;
    font-weight: 900;
}

.result-description {
    margin-top: 7px;

    color: #888;
}

/* WAITING */

.waiting {
    padding: 18px 0;

    text-align: center;

    color: #777;
}

/* MOVES */

.moves {
    margin-top: 14px;
}

.move {
    padding: 7px 0;

    border-bottom: 1px solid #222;

    color: #777;

    font-size: 11px;
}

/* TOAST */

.toast {
    position: fixed;

    left: 14px;
    right: 14px;

    bottom:
        calc(
            17px +
            env(safe-area-inset-bottom)
        );

    padding: 13px;

    border-radius: 13px;

    background: #fff;
    color: #000;

    font-size: 13px;
    font-weight: 800;

    text-align: center;

    display: none;

    z-index: 1000;
}

.toast.show {
    display: block;
}

</style>

</head>

<body>

<div class="app">

<div class="header">

    <div class="logo">
        HEAVY LUX CARD
    </div>

    <div
        id="connection"
        class="connection"
    >
        Подключение...
    </div>

</div>


<!-- LOBBY -->

<div
    id="lobby"
    class="lobby"
>

    <div class="card">

        <div class="title">
            Профиль
        </div>

        <div
            id="profileName"
            class="profile-name"
        >
            Загрузка...
        </div>

        <div
            id="profileId"
            class="profile-id"
        >
            —
        </div>

    </div>


    <div class="card">

        <div class="title">
            Дурак 1×1
        </div>

        <button
            id="createBtn"
            class="btn"
        >
            СОЗДАТЬ КОМНАТУ
        </button>

    </div>


    <div class="card">

        <div class="title">
            Войти по коду
        </div>

        <div class="join">

            <input
                id="roomInput"
                maxlength="6"
                placeholder="КОД"
                autocomplete="off"
            >

            <button
                id="joinBtn"
                class="btn"
            >
                ВОЙТИ
            </button>

        </div>

    </div>


    <div class="card">

        <div class="title">
            Комнаты
        </div>

        <div id="rooms">

            <div class="waiting">
                Загрузка...
            </div>

        </div>

    </div>

</div>


<!-- ROOM -->

<div
    id="roomScreen"
    class="room-screen"
>

    <div class="card">

        <div class="title">
            ДУРАК 1×1
        </div>

        <div
            id="bigCode"
            class="big-code"
        >
            ------
        </div>

        <div
            id="roomStatus"
            class="center"
        >
            Ожидание игрока...
        </div>


        <div
            id="trump"
            class="trump"
            style="display:none;"
        >

            <div class="trump-label">
                КОЗЫРЬ
            </div>

            <div
                id="trumpValue"
                class="trump-value"
            >
                —
            </div>

        </div>


        <div
            id="opponent"
            class="opponent"
            style="display:none;"
        >

            <div
                id="opponentName"
                class="opponent-name"
            >
                Противник
            </div>

            <div
                id="opponentCount"
                class="opponent-count"
            >
                6 карт
            </div>

        </div>


        <div
            id="turn"
            class="turn"
        >

            <div
                id="turnTitle"
                class="turn-title"
            >
                ОЖИДАНИЕ
            </div>

            <div
                id="turnDescription"
                class="turn-description"
            >
                Ожидаем второго игрока
            </div>

        </div>


        <div
            id="result"
            class="result"
        >

            <div
                id="resultTitle"
                class="result-title"
            >
                —
            </div>

            <div
                id="resultDescription"
                class="result-description"
            >
                —
            </div>

        </div>


        <div class="title">
            СТОЛ
        </div>

        <div
            id="table"
            class="table"
        >

            <div class="table-empty">
                Пока нет карт
            </div>

        </div>


        <div
            id="actions"
            class="actions"
        >

            <button
                id="takeBtn"
                class="btn take"
            >
                ВЗЯТЬ КАРТЫ
            </button>

            <button
                id="finishBtn"
                class="btn done"
            >
                БИТО — ЗАКОНЧИТЬ АТАКУ
            </button>

        </div>


        <div class="title"
             style="margin-top:16px;">
            МОИ КАРТЫ
        </div>

        <div
            id="hand"
            class="hand"
        >
        </div>


        <div
            id="deckInfo"
            class="center"
            style="
                margin-top:12px;
                color:#666;
                font-size:11px;
            "
        >
            Колода: —
        </div>


        <div class="title"
             style="margin-top:17px;">
            ИСТОРИЯ
        </div>

        <div
            id="moves"
            class="moves"
        >
        </div>


        <button
            id="leaveBtn"
            class="btn danger"
        >
            ПОКИНУТЬ КОМНАТУ
        </button>

    </div>

</div>

</div>


<div
    id="toast"
    class="toast"
></div>


<script>

/*
=========================================================
TELEGRAM
=========================================================
*/

const telegram =
    window.Telegram?.WebApp || null;

if (telegram) {

    telegram.ready();
    telegram.expand();
}


/*
=========================================================
STATE
=========================================================
*/

let socket = null;
let profile = null;
let currentGame = null;


/*
=========================================================
DOM
=========================================================
*/

const lobby =
    document.getElementById("lobby");

const roomScreen =
    document.getElementById("roomScreen");

const connection =
    document.getElementById("connection");

const profileName =
    document.getElementById("profileName");

const profileId =
    document.getElementById("profileId");

const rooms =
    document.getElementById("rooms");

const bigCode =
    document.getElementById("bigCode");

const roomStatus =
    document.getElementById("roomStatus");

const trump =
    document.getElementById("trump");

const trumpValue =
    document.getElementById("trumpValue");

const opponent =
    document.getElementById("opponent");

const opponentName =
    document.getElementById("opponentName");

const opponentCount =
    document.getElementById("opponentCount");

const turn =
    document.getElementById("turn");

const turnTitle =
    document.getElementById("turnTitle");

const turnDescription =
    document.getElementById("turnDescription");

const result =
    document.getElementById("result");

const resultTitle =
    document.getElementById("resultTitle");

const resultDescription =
    document.getElementById("resultDescription");

const table =
    document.getElementById("table");

const hand =
    document.getElementById("hand");

const deckInfo =
    document.getElementById("deckInfo");

const moves =
    document.getElementById("moves");

const takeBtn =
    document.getElementById("takeBtn");

const finishBtn =
    document.getElementById("finishBtn");


/*
=========================================================
TOAST
=========================================================
*/

let toastTimer = null;

function showToast(text) {

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        text;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            3000
        );
}


/*
=========================================================
AUTH
=========================================================
*/

function socketAuth() {

    const auth = {};

    if (
        telegram &&
        telegram.initData
    ) {

        auth.initData =
            telegram.initData;

    } else {

        let id =
            localStorage.getItem(
                "hlc_test_id"
            );

        if (!id) {

            id =
                "test_" +
                Math.random()
                    .toString(36)
                    .slice(2, 10);

            localStorage.setItem(
                "hlc_test_id",
                id
            );
        }

        auth.testPlayerId =
            id;
    }

    return auth;
}


/*
=========================================================
CONNECT
=========================================================
*/

function connect() {

    socket =
        io(
            window.location.origin,
            {
                auth:
                    socketAuth(),

                transports: [
                    "websocket",
                    "polling"
                ],

                reconnection: true,

                reconnectionAttempts:
                    Infinity,

                reconnectionDelay:
                    1000,

                reconnectionDelayMax:
                    5000,

                timeout:
                    10000
            }
        );


    socket.on(
        "connect",
        () => {

            connection.textContent =
                "Онлайн";

            connection.classList.add(
                "online"
            );

            socket.emit(
                "get_profile"
            );

            socket.emit(
                "get_rooms"
            );
        }
    );


    socket.on(
        "disconnect",
        () => {

            connection.textContent =
                "Переподключение...";

            connection.classList.remove(
                "online"
            );
        }
    );


    socket.on(
        "connect_error",
        error => {

            console.error(
                error
            );

            connection.textContent =
                "Ошибка Socket.IO";

            connection.classList.remove(
                "online"
            );
        }
    );


    /*
    PROFILE
    */

    socket.on(
        "profile",
        data => {

            profile =
                data;

            profileName.textContent =
                data.name ||
                "Игрок";

            profileId.textContent =
                "ID: " +
                data.playerId;
        }
    );


    /*
    ROOMS
    */

    socket.on(
        "rooms_list",
        list => {

            renderRooms(
                list
            );
        }
    );


    /*
    ROOM CREATED
    */

    socket.on(
        "room_created",
        room => {

            openRoom();

            bigCode.textContent =
                room.id;

            showToast(
                "Комната создана"
            );
        }
    );


    /*
    GAME
    */

    socket.on(
        "game_state",
        state => {

            currentGame =
                state;

            openRoom();

            renderGame(
                state
            );
        }
    );


    /*
    ERROR
    */

    socket.on(
        "error_message",
        message => {

            showToast(
                message
            );
        }
    );


    socket.on(
        "game_error",
        message => {

            showToast(
                message
            );
        }
    );


    /*
    LEFT
    */

    socket.on(
        "left_room",
        () => {

            currentGame =
                null;

            closeRoom();

            socket.emit(
                "get_rooms"
            );
        }
    );
}


/*
=========================================================
ROOMS
=========================================================
*/

function renderRooms(list) {

    if (!list.length) {

        rooms.innerHTML =
            `
            <div class="waiting">
                Нет доступных комнат
            </div>
            `;

        return;
    }

    rooms.innerHTML = "";

    list.forEach(
        room => {

            const full =
                room.playersCount >= 2;

            const playing =
                room.status ===
                "playing";

            const element =
                document.createElement(
                    "div"
                );

            element.className =
                "room";

            element.innerHTML =
                `
                <div class="room-head">

                    <div class="room-code">
                        ${escapeHtml(room.id)}
                    </div>

                    <div>
                        ${room.playersCount}/2
                    </div>

                </div>

                <div class="room-info">
                    ${
                        playing
                            ? "Игра идёт"
                            : "Ожидание второго игрока"
                    }
                </div>

                <button
                    class="btn secondary"
                    ${
                        full || playing
                            ? "disabled"
                            : ""
                    }
                >
                    ВОЙТИ
                </button>
                `;

            const button =
                element.querySelector(
                    "button"
                );

            if (
                !full &&
                !playing
            ) {

                button.onclick =
                    () => {

                        socket.emit(
                            "join_room",
                            room.id
                        );
                    };
            }

            rooms.appendChild(
                element
            );
        }
    );
}


/*
=========================================================
OPEN/CLOSE
=========================================================
*/

function openRoom() {

    lobby.classList.add(
        "hidden"
    );

    roomScreen.classList.add(
        "active"
    );
}

function closeRoom() {

    roomScreen.classList.remove(
        "active"
    );

    lobby.classList.remove(
        "hidden"
    );
}


/*
=========================================================
GAME
=========================================================
*/

function renderGame(state) {

    bigCode.textContent =
        state.roomId;

    deckInfo.textContent =
        "Колода: " +
        state.deckCount;


    /*
    STATUS
    */

    if (
        state.status ===
        "waiting"
    ) {

        roomStatus.textContent =
            "Ожидание второго игрока...";

    } else if (
        state.status ===
        "playing"
    ) {

        roomStatus.textContent =
            "Игра идёт";

    } else {

        roomStatus.textContent =
            "Игра завершена";
    }


    /*
    TRUMP
    */

    if (
        state.trumpSuit
    ) {

        trump.style.display =
            "block";

        trumpValue.textContent =
            state.trumpSuit;

    } else {

        trump.style.display =
            "none";
    }


    /*
    OPPONENT
    */

    if (
        state.opponent
    ) {

        opponent.style.display =
            "flex";

        opponentName.textContent =
            state.opponent.name;

        opponentCount.textContent =
            state.opponent.cardsCount +
            " карт";

    } else {

        opponent.style.display =
            "none";
    }


    /*
    TURN
    */

    turn.classList.remove(
        "your"
    );

    if (
        state.turn ===
        "YOUR_TURN"
    ) {

        turn.classList.add(
            "your"
        );

        turnTitle.textContent =
            "ВАШ ХОД";

        if (
            state.phase ===
            "attack"
        ) {

            if (
                state.table.length === 0
            ) {

                turnDescription.textContent =
                    "Выберите карту для атаки";

            } else {

                turnDescription.textContent =
                    "Карты отбиты — можно подкинуть или закончить атаку";
            }

        } else if (
            state.phase ===
            "defense"
        ) {

            turnDescription.textContent =
                "Выберите карту, чтобы отбиться, или возьмите карты";

        } else {

            turnDescription.textContent =
                "Ваш ход";
        }

    } else if (
        state.turn ===
        "OPPONENT_TURN"
    ) {

        turnTitle.textContent =
            "ХОД ПРОТИВНИКА";

        if (
            state.phase ===
            "defense"
        ) {

            turnDescription.textContent =
                "Противник защищается";

        } else {

            turnDescription.textContent =
                "Ожидайте действия противника";
        }

    } else {

        turnTitle.textContent =
            "ОЖИДАНИЕ";

        turnDescription.textContent =
            "Ожидаем второго игрока";
    }


    /*
    RESULT
    */

    if (
        state.status ===
        "finished"
    ) {

        result.classList.add(
            "active"
        );

        if (
            state.winnerId ===
            profile?.playerId
        ) {

            resultTitle.textContent =
                "ПОБЕДА";

            resultDescription.textContent =
                "Вы выиграли партию.";

        } else {

            resultTitle.textContent =
                "ПОРАЖЕНИЕ";

            resultDescription.textContent =
                "Вы проиграли партию.";
        }

    } else {

        result.classList.remove(
            "active"
        );
    }


    renderTable(
        state
    );

    renderHand(
        state
    );

    renderMoves(
        state
    );


    /*
    TAKE
    */

    takeBtn.classList.toggle(
        "visible",
        !!state.canTake
    );


    /*
    FINISH ATTACK
    */

    finishBtn.classList.toggle(
        "visible",
        !!state.canFinishAttack
    );
}


/*
=========================================================
TABLE
=========================================================
*/

function renderTable(state) {

    table.innerHTML = "";

    if (!state.table.length) {

        table.innerHTML =
            `
            <div class="table-empty">
                ${
                    state.phase === "attack"
                        ? "Ожидание атаки"
                        : "Нет карт"
                }
            </div>
            `;

        return;
    }

    state.table.forEach(
        pair => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "pair";

            const attack =
                document.createElement(
                    "div"
                );

            attack.className =
                "card-item " +
                (
                    isRed(
                        pair.attack.suit
                    )
                        ? "red"
                        : ""
                );

            attack.innerHTML =
                `
                <div class="card-rank">
                    ${escapeHtml(pair.attack.rank)}
                </div>

                <div class="card-suit">
                    ${escapeHtml(pair.attack.suit)}
                </div>
                `;

            row.appendChild(
                attack
            );


            const arrow =
                document.createElement(
                    "div"
                );

            arrow.className =
                "arrow";

            arrow.textContent =
                pair.defense
                    ? "→"
                    : "?";

            row.appendChild(
                arrow
            );


            if (
                pair.defense
            ) {

                const defense =
                    document.createElement(
                        "div"
                    );

                defense.className =
                    "card-item " +
                    (
                        isRed(
                            pair.defense.suit
                        )
                            ? "red"
                            : ""
                    );

                defense.innerHTML =
                    `
                    <div class="card-rank">
                        ${escapeHtml(pair.defense.rank)}
                    </div>

                    <div class="card-suit">
                        ${escapeHtml(pair.defense.suit)}
                    </div>
                    `;

                row.appendChild(
                    defense
                );
            }

            table.appendChild(
                row
            );
        }
    );
}


/*
=========================================================
HAND
=========================================================
*/

function renderHand(state) {

    hand.innerHTML = "";

    state.hand.forEach(
        card => {

            const element =
                document.createElement(
                    "div"
                );

            element.className =
                "card-item " +
                (
                    isRed(card.suit)
                        ? "red"
                        : ""
                );

            element.innerHTML =
                `
                <div class="card-rank">
                    ${escapeHtml(card.rank)}
                </div>

                <div class="card-suit">
                    ${escapeHtml(card.suit)}
                </div>
                `;

            element.onclick =
                () => {

                    handleCardClick(
                        card
                    );
                };

            hand.appendChild(
                element
            );
        }
    );
}


/*
=========================================================
CARD CLICK
=========================================================
*/

function handleCardClick(card) {

    if (!currentGame) {
        return;
    }

    if (
        currentGame.status !==
        "playing"
    ) {
        return;
    }

    /*
    АТАКА
    */

    if (
        currentGame.phase ===
        "attack" &&

        currentGame.turn ===
        "YOUR_TURN"
    ) {

        socket.emit(
            "attack_card",
            card.id
        );

        return;
    }


    /*
    ЗАЩИТА
    */

    if (
        currentGame.phase ===
        "defense" &&

        currentGame.turn ===
        "YOUR_TURN"
    ) {

        const target =
            currentGame.table.find(
                pair =>
                    !pair.defense
            );

        if (!target) {
            return;
        }

        socket.emit(
            "defend_card",
            {

                attackId:
                    target.attack.id,

                defenseId:
                    card.id
            }
        );
    }
}


/*
=========================================================
TAKE
=========================================================
*/

takeBtn.onclick =
    () => {

        if (!socket) {
            return;
        }

        socket.emit(
            "take_cards"
        );
    };


/*
=========================================================
FINISH ATTACK
=========================================================
*/

finishBtn.onclick =
    () => {

        if (!socket) {
            return;
        }

        socket.emit(
            "finish_attack"
        );
    };


/*
=========================================================
CREATE
=========================================================
*/

document
    .getElementById("createBtn")
    .onclick =
    () => {

        if (
            !socket ||
            !socket.connected
        ) {

            showToast(
                "Socket.IO не подключён"
            );

            return;
        }

        socket.emit(
            "create_room"
        );
    };


/*
=========================================================
JOIN
=========================================================
*/

document
    .getElementById("joinBtn")
    .onclick =
    () => {

        const input =
            document.getElementById(
                "roomInput"
            );

        const code =
            input.value
                .trim()
                .toUpperCase();

        if (!code) {

            showToast(
                "Введите код комнаты"
            );

            return;
        }

        socket.emit(
            "join_room",
            code
        );
    };


document
    .getElementById("roomInput")
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {

                document
                    .getElementById(
                        "joinBtn"
                    )
                    .click();
            }
        }
    );


/*
=========================================================
LEAVE
=========================================================
*/

document
    .getElementById("leaveBtn")
    .onclick =
    () => {

        if (
            socket &&
            socket.connected
        ) {

            socket.emit(
                "leave_room"
            );
        }
    };


/*
=========================================================
HELPERS
=========================================================
*/

function isRed(suit) {

    return (
        suit === "♥" ||
        suit === "♦"
    );
}

function escapeHtml(value) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


/*
=========================================================
START
=========================================================
*/

connect();

</script>

</body>
</html>
